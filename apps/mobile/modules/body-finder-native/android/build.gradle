apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'com.trochez.bodyfindernative'
version = '0.1.0'

android {
  namespace "com.trochez.bodyfindernative"
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName "0.1.0"
  }
}

// Gradle 9 fails Expo's own release test task when Expo ships test sources but
// discovers zero executable tests. Keep Body Finder's release build/test graph
// intact and suppress only that third-party false-positive task.
gradle.projectsEvaluated {
  def expoCore = rootProject.findProject(':expo-modules-core')
  if (expoCore != null) {
    expoCore.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
      failOnNoDiscoveredTests = false
    }
  }
}

dependencies {
  implementation 'androidx.core:core:1.16.0'
}
