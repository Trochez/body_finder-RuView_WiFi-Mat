[workspace]
resolver = "2"
members = [
  "crates/body-finder-core",
  "crates/body-finder-ruview-adapter",
  "crates/body-finder-science",
  "apps/node"
]

[workspace.package]
version = "0.2.0-experimental.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Trochez/body_finder-RuView_WiFi-Mat"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
