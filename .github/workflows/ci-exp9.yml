name: CI experimental.9

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-exp9-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce protocol, physical truth and adaptive BLE contracts
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "0.2.0-experimental.9" apps/mobile/App.tsx
          grep -q "HUMAN_SCANNING_ENABLED = false" apps/mobile/App.tsx
          grep -q "manual_geometry_override.*false" apps/mobile/App.tsx
          grep -q "pub const PROTOCOL_VERSION: u16 = 2;" crates/body-finder-core/src/lib.rs
          python3 validation/android/check_android_ranging_contract.py
          python3 validation/android/check_ble_range_accuracy_contract.py
          python3 validation/android/check_ble_continuity_contract.py
          python3 validation/android/check_ble_acquisition_contract.py
          python3 validation/android/check_ble_adaptive_acquisition_contract.py
          grep -q "FILTERED_PRIMARY" apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BleAcquisitionPolicy.kt
          grep -q "UNFILTERED_RECOVERY" apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BleAcquisitionPolicy.kt
          grep -q "BF_COHORT_STALLED" apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BleAcquisitionPolicy.kt
          grep -q "VALIDATION_ENVIRONMENT_INVALID" apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          grep -q "BATTERY_SAVER_ON" apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          grep -q "BLE_ACQUISITION_YIELD" apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/SystemRangingApi36.kt
          test -s IMPLEMENTATION_PLAN_BLE_ADAPTIVE_ACQUISITION_RECOVERY.md
          test -s docs/ANDROID_BLE_ADAPTIVE_ACQUISITION_RETEST.md
          python3 -m json.tool docs/CAPABILITY_MATRIX_AUTOGEOMETRY.json >/dev/null
          python3 -m json.tool protocol/schemas/autogeometry-v2.json >/dev/null
          python3 -m json.tool calibration/ble-range-calibration-schema.json >/dev/null
          python3 -m json.tool calibration/ble-range-calibration-profiles.json >/dev/null
          python3 -m json.tool validation/fixtures/ble-range/p0c-calibration-summary.json >/dev/null
          python3 -m json.tool validation/fixtures/ble-continuity/dev6-continuity-baseline.json >/dev/null
          python3 -m json.tool validation/fixtures/ble-acquisition/experimental7-physical-baseline.json >/dev/null
          python3 -m json.tool validation/fixtures/ble-adaptive-acquisition/experimental8-cohort-stall-baseline.json >/dev/null
          python3 -m py_compile validation/analysis/validate_autogeometry.py validation/analysis/fit_ble_range_profile.py validation/android/check_android_ranging_contract.py validation/android/check_ble_range_accuracy_contract.py validation/android/check_ble_continuity_contract.py validation/android/check_ble_acquisition_contract.py validation/android/check_ble_adaptive_acquisition_contract.py

  linux-x86_64:
    needs: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p body-finder-node

  windows-x86_64:
    needs: requirements
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p body-finder-node

  android:
    needs: requirements
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx tsc --noEmit
      - run: CI=1 npx expo prebuild --platform android --clean
      - name: Verify Android permissions/service
        shell: bash
        run: |
          set -euxo pipefail
          APP_MANIFEST=android/app/src/main/AndroidManifest.xml
          MODULE_MANIFEST=modules/body-finder-native/android/src/main/AndroidManifest.xml
          for P in BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_SCAN BLUETOOTH_CONNECT BLUETOOTH_ADVERTISE WAKE_LOCK FOREGROUND_SERVICE FOREGROUND_SERVICE_CONNECTED_DEVICE CHANGE_WIFI_MULTICAST_STATE; do
            grep -q "android.permission.${P}" "$APP_MANIFEST"
          done
          grep -q 'BodyFinderFieldService' "$MODULE_MANIFEST"
          grep -q 'android:foregroundServiceType="connectedDevice"' "$MODULE_MANIFEST"
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleRelease bundleRelease --stacktrace
        working-directory: apps/mobile/android
      - name: Verify merged release manifest
        shell: bash
        run: |
          set -euxo pipefail
          MERGED=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml -type f -exec grep -l 'BodyFinderFieldService' {} \; | head -n 1)
          test -n "$MERGED"
          grep -q 'foregroundServiceType="connectedDevice"' "$MERGED"
      - uses: actions/upload-artifact@v4
        with:
          name: android-ci-exp9
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  android-legacy:
    needs: requirements
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Create internal-test signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - run: gradle :app:assembleRelease --stacktrace

  ios-simulator:
    needs: requirements
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npx tsc --noEmit
      - run: CI=1 npx expo prebuild --platform ios --clean
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Build unsigned iOS Simulator app
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euxo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          xcodebuild -workspace "$WORKSPACE" -scheme BodyFinderRuView -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP=$(find build/Build/Products -type d -name '*.app' -print -quit)
          test -n "$APP"
