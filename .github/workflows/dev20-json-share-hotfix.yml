name: Dev20 JSON share hotfix

on:
  push:
    branches: [main]
    paths: [DEV20_JSON_SHARE_HOTFIX_TRIGGER.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev20-json-share-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Apply source hotfix
        run: |
          set -euxo pipefail
          python3 scripts/apply_dev20_share_hotfix.py
          python3 validation/analysis/validate_android_json_share_contract.py
          python3 -m py_compile validation/analysis/*.py scripts/*.py
          python3 validation/analysis/test_post_dev19_v1.py
          python3 validation/analysis/validate_dev19_baseline.py --output /tmp/dev19-baseline.json
      - name: Build and test universal Android
        working-directory: apps/mobile
        run: |
          set -euxo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          CI=1 npx expo prebuild --platform android --clean
          chmod +x android/gradlew
          ./android/gradlew -p android testReleaseUnitTest assembleRelease bundleRelease --stacktrace
      - name: Build and test legacy Android
        working-directory: apps/android-legacy
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace
      - name: Commit verified source hotfix
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile apps/android-legacy docs/TESTING_DEV20.md
          if git diff --cached --quiet; then
            echo 'Source hotfix already applied.'
          else
            git commit -m 'fix(dev20): share validation JSON as file attachment'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > /tmp/hotfix-sha
      - name: Assemble complete dev-20.1 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf dist inherited verify
          mkdir -p dist inherited
          gh release download dev-20 -D inherited
          cp -a inherited/. dist/
          cp apps/mobile/android/app/build/outputs/apk/release/*.apk dist/body-finder-ruview-universal.apk
          cp dist/body-finder-ruview-universal.apk dist/BodyFinder-dev20.1-universal.apk
          rm -f dist/BodyFinder-dev20-universal.apk
          cp apps/mobile/android/app/build/outputs/bundle/release/*.aab dist/body-finder-ruview.aab
          cp apps/android-legacy/app/build/outputs/apk/release/*.apk dist/body-finder-ruview-legacy-minsdk21.apk
          cp docs/TESTING_DEV20.md dist/TESTING_DEV20.md
          cp validation/analysis/validate_android_json_share_contract.py dist/validate_android_json_share_contract.py
          SHA=$(cat /tmp/hotfix-sha)
          python3 - <<PY
          import json, pathlib, hashlib, datetime
          d=pathlib.Path('dist')
          p=d/'release-manifest.json'
          m=json.load(open(p)) if p.exists() else {}
          m.update({
            'schema_version':20,
            'release':'dev-20.1',
            'version':'0.2.0-experimental.20.1',
            'commit_sha':'$SHA',
            'build_timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'hotfix_for':'dev-20',
            'android_json_share_transport':'content_uri_extra_stream',
            'android_json_share_inline_payload':False,
            'android_json_share_contract':'PASS',
            'physical_share_chooser_smoke':'REQUIRED_ON_EACH_TEST_DEVICE',
            'physical_acceptance':'PENDING_NEW_HUMAN_CAMPAIGN',
            'final_go':False,
          })
          inherited_names={x.name for x in pathlib.Path('inherited').iterdir() if x.is_file()}
          rebuilt={'body-finder-ruview-universal.apk','BodyFinder-dev20.1-universal.apk','body-finder-ruview.aab','body-finder-ruview-legacy-minsdk21.apk','TESTING_DEV20.md','validate_android_json_share_contract.py'}
          files=[f for f in sorted(d.iterdir()) if f.is_file() and f.name not in ('SHA256SUMS.txt','release-manifest.json','release-verification.json')]
          m['artifacts']=[{
            'name':f.name,'size_bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),
            'provenance':('rebuilt_dev20.1' if f.name in rebuilt else ('inherited_dev20_unchanged' if f.name in inherited_names else 'generated_dev20.1'))
          } for f in files]
          p.write_text(json.dumps(m,indent=2)+'\n')
          v={'release':'dev-20.1','ci_pass':True,'android_universal_build_pass':True,'android_legacy_build_pass':True,
             'android_json_share_contract_pass':True,'transport':'content_uri_extra_stream','inline_extra_text_for_full_json':False,
             'dev19_regression_pass':True,'physical_share_chooser_smoke':'REQUIRED_ON_EACH_DEVICE','physical_acceptance':'PENDING','final_go':False,
             'reason':'JSON sharing defect fixed and Android builds pass; physical HUMAN/EMPTY acceptance remains pending.'}
          (d/'release-verification.json').write_text(json.dumps(v,indent=2)+'\n')
          files=[f for f in sorted(d.iterdir()) if f.is_file() and f.name!='SHA256SUMS.txt']
          (d/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.name}\n' for f in files))
          PY
          gh release delete dev-20.1 -y || true
          git tag -f dev-20.1 "$SHA"
          git push origin refs/tags/dev-20.1 --force
          gh release create dev-20.1 $(find dist -maxdepth 1 -type f -print | sort) --prerelease --target "$SHA" --title 'Release dev-20.1 — JSON export hotfix' --notes 'Android JSON export hotfix for dev-20. Full validation evidence is now written to a private cache file and shared as application/json through FileProvider/content:// + EXTRA_STREAM instead of embedding the full evidence payload in EXTRA_TEXT. Universal and legacy APKs are rebuilt. Run the short share smoke test on each Android before the 5-minute HUMAN/EMPTY campaign. Human-presence physical acceptance remains pending.'
          mkdir verify
          gh release download dev-20.1 -D verify
          (cd verify && sha256sum -c SHA256SUMS.txt)
