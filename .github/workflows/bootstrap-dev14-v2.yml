name: Dev14 validation and release bootstrap v2

on:
  push:
    branches: [main]
    paths: ['DEV14_BOOTSTRAP_V2_TRIGGER.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - id: materialize
        continue-on-error: true
        run: |
          set -euxo pipefail
          python3 scripts/hotfix_apply_dev14.py
          python3 -m py_compile scripts/apply_dev14.py
          python3 scripts/apply_dev14.py
      - id: gates
        if: steps.materialize.outcome == 'success'
        continue-on-error: true
        run: |
          set -euxo pipefail
          python3 -m py_compile validation/analysis/dev14_validation.py validation/analysis/validate_dev14_hard_gates.py validation/analysis/validate_dev14_fixture_matrix.py validation/analysis/validate_timeline_causality.py validation/analysis/validate_peer_starvation_recovery.py validation/analysis/validate_environment_intervals.py validation/analysis/validate_release_manifest.py validation/android/check_dev14_recovery_contract.py validation/android/check_dev14_environment_contract.py validation/android/test_dev14_recovery_model.py
          python3 validation/android/check_dev14_recovery_contract.py
          python3 validation/android/check_dev14_environment_contract.py
          python3 validation/android/test_dev14_recovery_model.py
          python3 validation/analysis/validate_dev14_fixture_matrix.py
          python3 validation/analysis/validate_environment_authorization.py
          python3 validation/analysis/validate_dev14_hard_gates.py validation/fixtures/dev14/probe-deadline-near-limit.json
          python3 -m json.tool protocol/schemas/validation-run-snapshot-v3.json >/dev/null
          python3 -c "import json; s=json.load(open('protocol/schemas/validation-run-snapshot-v3.json')); req=set(s['properties']['environment'].get('required',[])); added={'total_background_ms','max_background_interval_ms','foreground_transition_count','unresolved_violation_count','environment_violation_events'}; assert not (req & added), req & added"
          cargo test --workspace
          grep -q '0.2.0-experimental.14' apps/mobile/src/version.ts
          grep -q 'reportVersion: 16' apps/mobile/src/version.ts
          grep -q '"versionCode": 14' apps/mobile/app.json
          grep -q '"releaseIteration": "experimental.14"' apps/mobile/app.json
          test -s DEV14_FROZEN_TRUTH.md
          test -s docs/TESTING_DEV14.md
          grep -qi 'No screenshots are required' docs/TESTING_DEV14.md
          test -s .github/workflows/release-exp14.yml
      - name: Commit implementation
        if: steps.materialize.outcome == 'success' && steps.gates.outcome == 'success'
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps validation protocol docs DEV14_FROZEN_TRUTH.md .github/workflows/release-exp14.yml scripts/apply_dev14.py
          if ! git diff --cached --quiet; then git commit -m 'feat: implement dev14 recovery atomicity and lifecycle evidence'; fi
      - name: Record result
        if: always()
        env:
          MATERIALIZE: ${{ steps.materialize.outcome }}
          GATES: ${{ steps.gates.outcome }}
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 -c "import json,os,pathlib; ok=os.environ.get('MATERIALIZE')=='success' and os.environ.get('GATES')=='success'; pathlib.Path('DEV14_BOOTSTRAP_RESULT_V2.json').write_text(json.dumps({'pass':ok,'materialize':os.environ.get('MATERIALIZE'),'gates':os.environ.get('GATES'),'run_id':os.environ.get('GITHUB_RUN_ID'),'sha':os.environ.get('GITHUB_SHA')},indent=2)+'\n')"
          git add DEV14_BOOTSTRAP_RESULT_V2.json
          if ! git diff --cached --quiet; then git commit -m 'ci: record dev14 bootstrap v2 result'; fi
          git push origin HEAD:main
      - name: Enforce success
        if: always()
        env:
          MATERIALIZE: ${{ steps.materialize.outcome }}
          GATES: ${{ steps.gates.outcome }}
        run: |
          test "$MATERIALIZE" = success
          test "$GATES" = success
