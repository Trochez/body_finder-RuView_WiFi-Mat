name: Bootstrap dev20.3 remediation
on:
  push:
    branches: [main]
    paths: [DEV20_3_BOOTSTRAP_TRIGGER.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bootstrap-dev20-3
  cancel-in-progress: false
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Apply remediation
        run: |
          set -euxo pipefail
          python3 scripts/apply_dev20_3_remediation.py
          python3 -m py_compile validation/analysis/dev20_3_detector.py validation/analysis/build_dev20_3_campaign.py validation/analysis/validate_dev20_3_human_detection.py validation/analysis/test_dev20_3_detector.py
          PYTHONPATH=validation/analysis python3 validation/analysis/test_dev20_3_detector.py
          grep -q "0.2.0-experimental.20.3" apps/mobile/src/version.ts
          grep -q "versionCode: 23" apps/mobile/src/version.ts
          grep -q '"versionCode": 23' apps/mobile/app.json
          grep -q '330_000L' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          ! grep -R 'deterministic-multinode-rssi-fusion-v2-online' apps/mobile/src validation/analysis
          grep -q 'dev20.3-self-contained-json-evidence-v6' apps/mobile/App.tsx
          grep -q 'physical_smoke_parity.*PENDING' validation/baselines/dev20_2/online-offline-parity-report.json
      - name: Typecheck mobile
        working-directory: apps/mobile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit implementation
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps validation protocol docs capability-truth-matrix.json .github/workflows/release-dev20.3.yml
          git diff --cached --check
          git commit -m 'feat: implement dev-20.3 physical acceptance remediation'
          git push origin HEAD:main
