name: Fix dev20.11 geometry marker

on:
  push:
    branches: [main]
    paths: [FIX_DEV20_11_GEOMETRY_MARKER_TRIGGER.txt]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add explicit V11 schema marker to generated geometry module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/implement_dev20_11.py')
          s=p.read_text(encoding='utf-8')
          old="p='apps/mobile/src/autogeometry.ts';s=rd(p).replace(\"| 'COORDINATOR_PUBLICATION_V10'\",\"| 'COORDINATOR_PUBLICATION_V11'\",1)"
          new=old+"\ns=s.replace(\"export type GeometryPublication = GeometrySolution & {\",\"export const GEOMETRY_PUBLICATION_SCHEMA='GeometryPublicationV11';\\nexport type GeometryPublication = GeometrySolution & {\",1)"
          if old not in s: raise SystemExit('geometry implementation marker missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          compile(p.read_text(encoding='utf-8'),str(p),'exec')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/implement_dev20_11.py
          git diff --cached --check
          git commit -m "fix(dev20.11): expose GeometryPublicationV11 schema marker"
          git push origin HEAD:main
