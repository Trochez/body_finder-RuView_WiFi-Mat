name: Release dev20.11

on:
  push:
    branches: [main]
    paths: [RELEASE_DEV20_11_TRIGGER.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-dev20-11
  cancel-in-progress: true

env:
  BUILD_VERSION: 0.2.0-experimental.20.11
  DETECTOR_ALGORITHM: deterministic-multinode-rssi-fusion-v9
  DETECTOR_HASH: f5795d40fbfb1de728b8576e214b249ada67f70d7962e1bf7794eb9c7d251f17

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply dev20.11 implementation
        run: python scripts/implement_dev20_11.py
      - run: cargo build --release -p body-finder-node -p body-finder-science --bins
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\win | Out-Null
          Copy-Item target\release\body-finder-node.exe dist\win\
          Copy-Item target\release\body-finder-detector.exe dist\win\
          if (Test-Path target\release\body-finder-replay.exe) { Copy-Item target\release\body-finder-replay.exe dist\win\ }
          if (Test-Path target\release\body-finder-validate-session.exe) { Copy-Item target\release\body-finder-validate-session.exe dist\win\ }
          if (Test-Path target\release\body-finder-rf-recorder.exe) { Copy-Item target\release\body-finder-rf-recorder.exe dist\win\ }
          Copy-Item target\release\body-finder-detector.exe dist\body-finder-detector-windows-x86_64.exe
          Compress-Archive dist\win\* dist\body-finder-windows-wsl-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dev20-11-windows
          path: |
            dist/body-finder-windows-wsl-x86_64.zip
            dist/body-finder-detector-windows-x86_64.exe

  build-release:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - uses: actions/download-artifact@v4
        with:
          name: dev20-11-windows
          path: dist

      - name: Apply dev20.11 implementation
        run: python3 scripts/implement_dev20_11.py

      - name: Engineering gates G0-G9
        run: |
          set -euxo pipefail
          grep -q "0.2.0-experimental.20.11" apps/mobile/src/version.ts
          grep -q "reportVersion: 31" apps/mobile/src/version.ts
          grep -q "versionCode: 31" apps/mobile/src/version.ts
          grep -q "snapshotSchemaVersion: 14" apps/mobile/src/version.ts
          grep -q "versionCode 31" apps/android-legacy/app/build.gradle
          grep -q "0.2.0-experimental.20.11-legacy" apps/android-legacy/app/build.gradle
          grep -q "$DETECTOR_ALGORITHM" crates/body-finder-science/src/human_detector.rs
          grep -q "$DETECTOR_HASH" apps/mobile/src/detectorParameters.ts
          grep -q "WireEnvelopeV10" apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          grep -q "WireTransportTelemetryV11" apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          grep -q "ArtifactManifestV3" apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          grep -q "GeometryPublicationV11" apps/mobile/src/autogeometry.ts
          grep -q "BodyFinderControlPlaneV9" apps/mobile/src/humanPresence.ts
          grep -q "ScenarioCommandV1" apps/mobile/src/campaignControl.ts
          grep -q "RunFreezeCommitV1" apps/mobile/src/campaignControl.ts
          grep -q "dev20.11-self-contained-json-evidence-v14" apps/mobile/modules/body-finder-native/index.ts
          python3 -m py_compile validation/analysis/validate_dev20_11_preflight.py validation/analysis/validate_dev20_11_smoke.py validation/analysis/validate_dev20_11_campaign.py validation/analysis/test_dev20_11_contract.py
          python3 validation/analysis/test_dev20_11_contract.py
          python3 validation/analysis/test_post_dev19_v1.py
          python3 validation/analysis/validate_dev19_baseline.py --output /tmp/dev19-baseline.json
          python3 - <<'PY'
          import json,pathlib
          for p in pathlib.Path('validation/schemas').glob('*v1*.json'): json.loads(p.read_text())
          for n in ['dev20.11-evidence-schema-v14.json','dev20.11-campaign-schema.json','scenario-command-v1-schema.json','snapshot-freeze-v1-schema.json','control-plane-v9-schema.json','wire-transport-telemetry-v11-schema.json','range-frame-v9-schema.json','geometry-publication-v11-schema.json','artifact-manifest-v3-schema.json']: json.loads((pathlib.Path('validation/schemas')/n).read_text())
          PY
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo build --release -p body-finder-node -p body-finder-science --bins
          cd apps/mobile
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Commit verified implementation to main
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(dev20.11): scenario freeze MTU artifact geometry remediation"
            git push origin HEAD:main
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Package Linux
        run: |
          set -euxo pipefail
          mkdir -p dist work/deb/DEBIAN work/deb/usr/bin
          tar -C target/release -czf dist/body-finder-node-linux-x86_64.tar.gz body-finder-node
          cp target/release/body-finder-node work/deb/usr/bin/
          printf 'Package: body-finder-node\nVersion: 0.2.0~experimental20.11\nSection: science\nPriority: optional\nArchitecture: amd64\nMaintainer: Trochez\nDescription: Body Finder RuView field node\n' > work/deb/DEBIAN/control
          dpkg-deb --build work/deb dist/body-finder-node-linux-x86_64.deb
          cp target/release/body-finder-detector dist/body-finder-detector-linux-x86_64
          chmod +x dist/body-finder-detector-linux-x86_64

      - name: Build Android universal APK and AAB
        run: |
          set -euxo pipefail
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
          rm -rf apps/mobile/modules/body-finder-native/android/src/main/jniLibs
          mkdir -p apps/mobile/modules/body-finder-native/android/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o apps/mobile/modules/body-finder-native/android/src/main/jniLibs build --release -p body-finder-science --lib
          cd apps/mobile
          CI=1 npx expo prebuild --platform android --clean
          chmod +x android/gradlew
          ./android/gradlew -p android testReleaseUnitTest assembleRelease bundleRelease --stacktrace
          cd ../..
          cp apps/mobile/android/app/build/outputs/apk/release/*.apk dist/body-finder-ruview-universal.apk
          cp dist/body-finder-ruview-universal.apk dist/BodyFinder-dev20.11-universal.apk
          cp apps/mobile/android/app/build/outputs/bundle/release/*.aab dist/body-finder-ruview.aab

      - name: Build Android legacy minSdk21 APK
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000; fi
          cd apps/android-legacy
          gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace
          cd ../..
          cp apps/android-legacy/app/build/outputs/apk/release/*.apk dist/body-finder-ruview-legacy-minsdk21.apk

      - name: Package validators fixtures schemas reports and metadata
        run: |
          set -euxo pipefail
          cp TESTING_DEV20_11.md dist/TESTING_DEV20_11.md
          for f in dev20.11-evidence-schema-v14.json dev20.11-campaign-schema.json scenario-command-v1-schema.json snapshot-freeze-v1-schema.json control-plane-v9-schema.json wire-transport-telemetry-v11-schema.json range-frame-v9-schema.json geometry-publication-v11-schema.json artifact-manifest-v3-schema.json; do cp validation/schemas/$f dist/$f; done
          cp validation/detector-parameter-manifest-v9.json dist/detector-parameter-manifest-v9.json
          for f in dev20.10-g10-no-go-verdict.json dev20.10-physical-evidence-root-cause-report.json scenario-authority-remediation-report.json snapshot-authority-durability-report.json control-frame-mtu-v11-report.json artifact-v3-stability-report.json transport-priority-report.json geometry-v11-continuity-report.json authority-peer-parity-report.json detector-v9-no-regression-report.json validator-contract-parity-report.json online-offline-parity-report.json synthetic-dev20.11-g10-report.json release-manifest.json; do cp validation/reports/$f dist/$f; done
          rm -rf kit fixturepack
          mkdir -p kit/validation/analysis kit/validation/schemas kit/validation/fixtures/dev20_11 kit/validation/reports fixturepack/dev20_11
          cp validation/analysis/validate_dev20_11_preflight.py validation/analysis/validate_dev20_11_smoke.py validation/analysis/validate_dev20_11_campaign.py validation/analysis/test_dev20_11_contract.py kit/validation/analysis/
          cp validation/schemas/dev20.11-evidence-schema-v14.json validation/schemas/dev20.11-campaign-schema.json validation/schemas/scenario-command-v1-schema.json validation/schemas/snapshot-freeze-v1-schema.json validation/schemas/control-plane-v9-schema.json validation/schemas/wire-transport-telemetry-v11-schema.json validation/schemas/range-frame-v9-schema.json validation/schemas/geometry-publication-v11-schema.json validation/schemas/artifact-manifest-v3-schema.json kit/validation/schemas/
          cp -r validation/fixtures/dev20_10/* kit/validation/fixtures/dev20_11/ || true
          cp validation/reports/*.json kit/validation/reports/
          cp validation/detector-parameter-manifest-v9.json kit/validation/
          cp TESTING_DEV20_11.md kit/
          cp -r validation/fixtures/dev20_10/* fixturepack/dev20_11/ || true
          (cd kit && zip -qr ../dist/validators-dev20.11.zip .)
          (cd fixturepack && zip -qr ../dist/fixtures-dev20.11.zip dev20_11)
          python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path('dist');o={'schema_version':14,'release':'dev-20.11','build':os.environ['BUILD_VERSION'],'source_sha':os.environ['SOURCE_SHA'],'protocol_version':2,'report_version':31,'snapshot_schema_version':14,'evidence_contract':'dev20.11-self-contained-json-evidence-v14','wire_contract':'WireEnvelopeV10','wire_telemetry':'WireTransportTelemetryV11','control_plane':'BodyFinderControlPlaneV9','artifact_manifest':'ArtifactManifestV3','geometry_publication':'GeometryPublicationV11','detector_algorithm':os.environ['DETECTOR_ALGORITHM'],'detector_parameter_hash':os.environ['DETECTOR_HASH'],'engineering_ci_pass':True,'G10':'PENDING','G11':'BLOCKED','G12':'PENDING','g10_go':False,'g11_go':False,'g12_go':False,'final_go':False,'dev21_blocked':True,'screenshots_required':False,'redownload_verified_by_successful_workflow_exit':True};(d/'release-verification.json').write_text(json.dumps(o,indent=2,sort_keys=True)+'\n')
          PY

      - uses: anchore/sbom-action@v0
        with:
          path: '.'
          format: spdx-json
          output-file: dist/SBOM.spdx.json

      - name: Verify exact 39-asset inventory and checksums
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,pathlib
          d=pathlib.Path('dist')
          required='BodyFinder-dev20.11-universal.apk body-finder-ruview-universal.apk body-finder-ruview-legacy-minsdk21.apk body-finder-ruview.aab body-finder-node-linux-x86_64.tar.gz body-finder-node-linux-x86_64.deb body-finder-windows-wsl-x86_64.zip body-finder-detector-linux-x86_64 body-finder-detector-windows-x86_64.exe validators-dev20.11.zip fixtures-dev20.11.zip dev20.11-evidence-schema-v14.json dev20.11-campaign-schema.json scenario-command-v1-schema.json snapshot-freeze-v1-schema.json control-plane-v9-schema.json wire-transport-telemetry-v11-schema.json range-frame-v9-schema.json geometry-publication-v11-schema.json artifact-manifest-v3-schema.json detector-parameter-manifest-v9.json dev20.10-g10-no-go-verdict.json dev20.10-physical-evidence-root-cause-report.json scenario-authority-remediation-report.json snapshot-authority-durability-report.json control-frame-mtu-v11-report.json artifact-v3-stability-report.json transport-priority-report.json geometry-v11-continuity-report.json authority-peer-parity-report.json detector-v9-no-regression-report.json validator-contract-parity-report.json online-offline-parity-report.json synthetic-dev20.11-g10-report.json release-manifest.json release-verification.json SBOM.spdx.json TESTING_DEV20_11.md'.split()
          actual=[p.name for p in d.iterdir() if p.is_file()];missing=sorted(set(required)-set(actual));extra=sorted(set(actual)-set(required))
          if missing or extra or len(actual)!=38:raise SystemExit(f'pre-SHA inventory failure missing={missing} extra={extra} count={len(actual)}')
          if any((d/n).stat().st_size<=0 for n in required):raise SystemExit('empty asset')
          files=sorted(p for p in d.iterdir() if p.is_file());(d/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          if len([p for p in d.iterdir() if p.is_file()])!=39:raise SystemExit('final inventory !=39')
          PY

      - name: Publish prerelease and independently redownload verify 39 of 39
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          trap 'gh release delete dev-20.11 -y || true; git push origin :refs/tags/dev-20.11 || true' ERR
          git tag -f dev-20.11 "$SOURCE_SHA"
          git push origin refs/tags/dev-20.11 --force
          gh release delete dev-20.11 -y || true
          gh release create dev-20.11 dist/* --prerelease --target "$SOURCE_SHA" --title 'Release dev-20.11 — G10 infrastructure remediation' --notes 'Engineering G0-G9 PASS. G10=PENDING, G11=BLOCKED, G12=PENDING, final_go=false, dev21_blocked=true. Use TESTING_DEV20_11.md on Pixel 10 Pro + Pixel 7 Pro + Lenovo TB-J606L. JSON is authoritative; screenshots are not required.'
          rm -rf redownload && mkdir redownload
          gh release download dev-20.11 --dir redownload
          test "$(find redownload -maxdepth 1 -type f | wc -l)" = "39"
          (cd redownload && sha256sum -c SHA256SUMS.txt)
          test "$(git rev-list -n 1 dev-20.11)" = "$SOURCE_SHA"
          echo "DEV20_11_RELEASE_VERIFIED sha=$SOURCE_SHA assets=39 G10=PENDING G11=BLOCKED final_go=false"
