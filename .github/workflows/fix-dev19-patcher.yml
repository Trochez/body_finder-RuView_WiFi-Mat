name: Repair dev19 source patcher
on:
  push:
    branches: [dev-19]
    paths: [FIX_DEV19_PATCHER_TRIGGER.txt]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev-19, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Repair getPeersJson expirePeers signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt')
          s=p.read_text()
          old='''    Function("getPeersJson") {\n      expirePeers(System.currentTimeMillis())\n      val arr = JSONArray()\n'''
          new='''    Function("getPeersJson") {\n      val ctx = appContext.reactContext\n      if (ctx != null) expirePeers(ctx.applicationContext, System.currentTimeMillis())\n      val arr = JSONArray()\n'''
          if old not in s:
              if new in s:
                  print('compile fix already applied')
              else:
                  raise SystemExit('getPeersJson expirePeers call contract not found')
          else:
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          grep -q 'if (ctx != null) expirePeers(ctx.applicationContext, System.currentTimeMillis())' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          git diff --check
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          if ! git diff --cached --quiet; then
            git commit -m 'fix(dev19): pass Context to peer expiry diagnostics'
            git push origin HEAD:dev-19
          fi
