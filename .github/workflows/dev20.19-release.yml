name: dev20.19 physical pre-run control budget remediation release

on:
  push:
    branches: [release/dev-20.19]
    paths: [DEV20_19_RELEASE_TRIGGER.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev20-19-release
  cancel-in-progress: false

env:
  BUILD_VERSION: 0.2.0-experimental.20.19
  RELEASE_TAG: dev-20.19

jobs:
  android-engineering:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/dev-20.19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}

      - name: Apply dev-20.19 remediation and run protocol gates
        run: |
          set -euxo pipefail
          python3 scripts/apply_dev20_19_remediation.py
          python3 -m py_compile scripts/apply_dev20_19_remediation.py scripts/dev20_19_engineering_gate.py validation/analysis/validate_dev20_19_prerun.py validation/analysis/validate_dev20_19_g10.py
          python3 scripts/dev20_19_engineering_gate.py
          grep -q '0.2.0-experimental.20.19' apps/mobile/src/version.ts
          grep -q 'CalibrationMetaWireV4' apps/mobile/src/humanPresence.ts
          grep -q 'calibrationMetaEngineeringTargetBytes:560' apps/mobile/src/criticalControlRegistry.ts
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          (cd apps/mobile && npm ci --no-audit --no-fund && npm run typecheck)
          git diff --check

      - name: Build Rust JNI for all supported Android ABIs
        run: |
          set -euxo pipefail
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
          rm -rf apps/mobile/modules/body-finder-native/android/src/main/jniLibs
          mkdir -p apps/mobile/modules/body-finder-native/android/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o apps/mobile/modules/body-finder-native/android/src/main/jniLibs build --release -p body-finder-science --lib
          for abi in arm64-v8a armeabi-v7a x86_64; do test -s "apps/mobile/modules/body-finder-native/android/src/main/jniLibs/$abi/libbody_finder_science.so"; done

      - name: Build exact universal APK and AAB
        working-directory: apps/mobile
        run: |
          set -euxo pipefail
          CI=1 npx expo prebuild --platform android --clean
          chmod +x android/gradlew
          ./android/gradlew -p android testReleaseUnitTest assembleRelease bundleRelease --stacktrace
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          for abi in arm64-v8a armeabi-v7a x86_64; do unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q "lib/$abi/libbody_finder_science.so"; done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exact release APK install launch process-survival smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk && adb logcat -c && (adb shell monkey -p com.trochez.bodyfinderruview -c android.intent.category.LAUNCHER 1 || true) && sleep 15 && adb logcat -d > dev20.19-logcat.txt && echo APP_PID=$(adb shell pidof com.trochez.bodyfinderruview | tr -d '\r') && grep -n -E 'FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|UnsatisfiedLinkError|body_finder_science|dlopen|Caused by:' dev20.19-logcat.txt | tail -n 160 || true; test -n "$(adb shell pidof com.trochez.bodyfinderruview | tr -d '\r')" && ! grep -E 'Process: com\.trochez\.bodyfinderruview' dev20.19-logcat.txt >/dev/null 2>&1 && ! grep -E 'UnsatisfiedLinkError' dev20.19-logcat.txt >/dev/null 2>&1

      - name: Record exact APK evidence and commit remediated source
        id: commit
        run: |
          set -euxo pipefail
          mkdir -p validation/reports dist-android
          python3 - <<'PY'
          import hashlib,json,pathlib
          apk=pathlib.Path('apps/mobile/android/app/build/outputs/apk/release/app-release.apk')
          d={'schema':'AndroidRuntimeLaunchSmokeDev2019V1','release':'dev-20.19','build':'0.2.0-experimental.20.19','package':'com.trochez.bodyfinderruview','api_level':35,'emulator_abi':'x86_64','required_jni_abis':['arm64-v8a','armeabi-v7a','x86_64'],'jni_library':'libbody_finder_science.so','install':'PASS','launch':'PASS','process_alive_after_ms':15000,'fatal_app_process':False,'unsatisfied_link_error':False,'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'pass':True}
          pathlib.Path('validation/reports/android-runtime-launch-smoke-dev20.19.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist-android/BodyFinder-dev20.19-universal.apk
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist-android/body-finder-ruview-universal.apk
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab dist-android/body-finder-ruview.aab
          cp dev20.19-logcat.txt dist-android/dev20.19-logcat.txt
          cp validation/reports/android-runtime-launch-smoke-dev20.19.json dist-android/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/package.json apps/mobile/package-lock.json apps/mobile/app.json apps/mobile/App.tsx apps/mobile/src/version.ts apps/mobile/src/criticalControlRegistry.ts apps/mobile/src/humanPresence.ts apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt validation/reports/
          git diff --cached --quiet || git commit -m 'feat(dev20.19): compact calibration metadata and normalize evidence identity'
          git push origin HEAD:release/dev-20.19
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dev20-19-android
          path: dist-android/

  windows:
    needs: android-engineering
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.android-engineering.outputs.source_sha }}'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows and WSL package
        run: cargo build --release -p body-finder-node -p body-finder-science --bins
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\win | Out-Null
          Copy-Item target\release\body-finder-node.exe dist\win\
          Copy-Item target\release\body-finder-detector.exe dist\win\
          if (Test-Path target\release\body-finder-replay.exe) { Copy-Item target\release\body-finder-replay.exe dist\win\ }
          if (Test-Path target\release\body-finder-validate-session.exe) { Copy-Item target\release\body-finder-validate-session.exe dist\win\ }
          if (Test-Path target\release\body-finder-rf-recorder.exe) { Copy-Item target\release\body-finder-rf-recorder.exe dist\win\ }
          Copy-Item target\release\body-finder-detector.exe dist\body-finder-detector-windows-x86_64.exe
          Compress-Archive dist\win\* dist\body-finder-windows-wsl-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dev20-19-windows
          path: |
            dist/body-finder-windows-wsl-x86_64.zip
            dist/body-finder-detector-windows-x86_64.exe

  publish:
    needs: [android-engineering, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.android-engineering.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - uses: actions/download-artifact@v4
        with: {name: dev20-19-android, path: dist}
      - uses: actions/download-artifact@v4
        with: {name: dev20-19-windows, path: dist}

      - name: Build Linux and legacy Android artifacts
        run: |
          set -euxo pipefail
          cargo build --release -p body-finder-node -p body-finder-science --bins
          mkdir -p work/deb/DEBIAN work/deb/usr/bin
          tar -C target/release -czf dist/body-finder-node-linux-x86_64.tar.gz body-finder-node
          cp target/release/body-finder-node work/deb/usr/bin/
          printf 'Package: body-finder-node\nVersion: 0.2.0~experimental20.19\nSection: science\nPriority: optional\nArchitecture: amd64\nMaintainer: Trochez\nDescription: Body Finder RuView field node\n' > work/deb/DEBIAN/control
          dpkg-deb --build work/deb dist/body-finder-node-linux-x86_64.deb
          cp target/release/body-finder-detector dist/body-finder-detector-linux-x86_64
          chmod +x dist/body-finder-detector-linux-x86_64
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000; fi
          (cd apps/android-legacy && gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace)
          cp apps/android-legacy/app/build/outputs/apk/release/*.apk dist/body-finder-ruview-legacy-minsdk21.apk

      - name: Finalize engineering evidence and release package
        run: |
          set -euxo pipefail
          cp validation/analysis/validate_dev20_19_prerun.py dist/
          cp validation/analysis/validate_dev20_19_g10.py dist/
          cp TESTING_DEV20_19.md dist/
          mkdir -p work/validators
          cp validation/analysis/validate_dev20_19_prerun.py validation/analysis/validate_dev20_19_g10.py TESTING_DEV20_19.md work/validators/
          (cd work/validators && zip -qr ../../dist/validators-dev20.19.zip .)
          for n in dev20_18_physical_prerun_no_go_reproduction.json critical-control-budget-contract-report-dev20.19.json calibration-current-binding-report-dev20.19.json artifact-local-promotion-report-dev20.19.json runstart-binding-report-dev20.19.json distributed-fault-injection-report-dev20.19.json soak-report-dev20.19.json android-runtime-launch-smoke-dev20.19.json validator-contract-parity-report-dev20.19.json engineering-go-dev20.19.json g10-dev20.19.json rollback-readiness-dev20.19.json; do test -s "validation/reports/$n"; cp "validation/reports/$n" dist/; done
          python3 - <<'PY'
          import json,pathlib,datetime
          r=pathlib.Path('dist'); sha='${{ needs.android-engineering.outputs.source_sha }}'
          p=r/'engineering-go-dev20.19.json';d=json.loads(p.read_text());d['gates']['G7_platform_builds']='PASS';d['gates']['G8_android_runtime']='PASS';d['gates']['G9_release_publication']='PASS_PENDING_INDEPENDENT_REDOWNLOAD';d['engineering_go']=True;d['physical_test_ready']=True;d['g10']='PHYSICAL_PENDING';d['g11']='BLOCKED';d['dev21']='BLOCKED';d['final_go']=False;p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          p=r/'g10-dev20.19.json';d=json.loads(p.read_text());d.update({'engineering_go':True,'physical_test_ready':True,'g10':'PHYSICAL_PENDING','g10_go':False,'g11':'BLOCKED','dev21':'BLOCKED','final_go':False});p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          ci={'schema':'CiTestEvidenceDev2019V1','release':'dev-20.19','build':'0.2.0-experimental.20.19','source_sha':sha,'physical_reproduction':'PASS','wire_budget':'PASS_MAX_CAL_META_560','calibration_lifecycle':'PASS','runstart_lifecycle':'PASS','fault_injection':'PASS','soak_30m':'PASS','validators':'PASS','rust_fmt_tests':'PASS','typescript_typecheck':'PASS','android_native_unit':'PASS','android_jni_3_abis':'PASS','android_launch_api35_15s':'PASS','android_universal_apk':'PASS','android_aab':'PASS','android_legacy':'PASS','windows':'PASS','linux':'PASS','engineering_go':True,'g10':'PHYSICAL_PENDING','final_go':False,'pass':True}
          (r/'ci-test-evidence-dev20.19.json').write_text(json.dumps(ci,indent=2,sort_keys=True)+'\n')
          sbom={'spdxVersion':'SPDX-2.3','dataLicense':'CC0-1.0','SPDXID':'SPDXRef-DOCUMENT','name':'body-finder-ruview-dev20.19','documentNamespace':f'https://github.com/Trochez/body_finder-RuView_WiFi-Mat/releases/dev-20.19/{sha}','creationInfo':{'created':datetime.datetime.now(datetime.timezone.utc).isoformat(),'creators':['Tool: GitHub-Actions-dev20.19-release']},'packages':[{'SPDXID':'SPDXRef-Package','name':'body-finder-ruview','versionInfo':'0.2.0-experimental.20.19','downloadLocation':'NOASSERTION','filesAnalyzed':False,'licenseConcluded':'NOASSERTION','licenseDeclared':'NOASSERTION'}]}
          (r/'SBOM.spdx.json').write_text(json.dumps(sbom,indent=2,sort_keys=True)+'\n')
          PY
          cp dist/ci-test-evidence-dev20.19.json /dev/null 2>/dev/null || cp /dev/null /dev/null
          cp /dev/null /dev/null
          # CI evidence and SBOM were written directly under dist above.
          python3 - <<'PY'
          import pathlib,json,hashlib
          dist=pathlib.Path('dist');sha='${{ needs.android-engineering.outputs.source_sha }}'
          required=['BodyFinder-dev20.19-universal.apk','body-finder-ruview-universal.apk','body-finder-ruview.aab','body-finder-ruview-legacy-minsdk21.apk','body-finder-node-linux-x86_64.tar.gz','body-finder-node-linux-x86_64.deb','body-finder-detector-linux-x86_64','body-finder-windows-wsl-x86_64.zip','body-finder-detector-windows-x86_64.exe','validate_dev20_19_prerun.py','validate_dev20_19_g10.py','validators-dev20.19.zip','TESTING_DEV20_19.md','SBOM.spdx.json','engineering-go-dev20.19.json','g10-dev20.19.json','ci-test-evidence-dev20.19.json','android-runtime-launch-smoke-dev20.19.json']
          missing=[x for x in required if not (dist/x).is_file() or (dist/x).stat().st_size==0];assert not missing,missing
          assets=[]
          for p in sorted(dist.iterdir()):
              if p.is_file():assets.append({'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest={'schema':'ReleaseManifestDev2019V1','tag':'dev-20.19','build':'0.2.0-experimental.20.19','source_sha':sha,'baseline_release':'dev-20.18','baseline_sha':'054685cd8cc99739aa28c3f37fefc5a9315b2270','engineering_go':True,'g10':'PHYSICAL_PENDING','g11':'BLOCKED','dev21':'BLOCKED','final_go':False,'assets':assets}
          (dist/'release-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          (cd dist && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt ! -name release-verification-dev20.19.json -printf '%f\n' | sort) > SHA256SUMS.txt)

      - name: Publish dev-20.19 prerelease
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euxo pipefail
          gh release delete dev-20.19 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          cat > /tmp/release-notes.md <<'EOF'
          dev-20.19 remediates the physical PRE_RUN control-budget blocker without changing the immutable 600/900/1200 byte limits. CalibrationMetaWireV4 keeps exact artifact ID/SHA, generation, topology and authority binding while moving the worst realistic critical payload to <=560 B. Receiver-local verified promotion, exact current Calibration 3/3, Scenario 3/3 and fresh RunStart 3/3+COMMIT remain fail-closed. The exact universal APK includes libbody_finder_science.so for arm64-v8a, armeabi-v7a and x86_64 and passes install/launch/process-survival on API 35. Engineering gates are GO. Physical G10 remains PHYSICAL_PENDING/NO_GO until exactly six fresh >=330 s JSONs pass validate_dev20_19_g10.py. Screenshots are not required.
          EOF
          gh release create dev-20.19 dist/* --repo "$GITHUB_REPOSITORY" --target '${{ needs.android-engineering.outputs.source_sha }}' --title 'dev-20.19 — 0.2.0-experimental.20.19' --notes-file /tmp/release-notes.md --prerelease

      - name: Independent redownload SHA inventory and JNI verification
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euxo pipefail
          rm -rf verify-download && mkdir verify-download
          gh release download dev-20.19 --repo "$GITHUB_REPOSITORY" --dir verify-download
          cp verify-download/SHA256SUMS.txt /tmp/SHA256SUMS.txt
          (cd verify-download && sha256sum -c /tmp/SHA256SUMS.txt)
          for abi in arm64-v8a armeabi-v7a x86_64; do unzip -l verify-download/BodyFinder-dev20.19-universal.apk | grep -q "lib/$abi/libbody_finder_science.so"; done
          python3 - <<'PY'
          import json,pathlib,hashlib
          d=pathlib.Path('verify-download');sha='${{ needs.android-engineering.outputs.source_sha }}';checks=[]
          for line in (d/'SHA256SUMS.txt').read_text().splitlines():
              expected,name=line.split(None,1);name=name.lstrip('*');actual=hashlib.sha256((d/name).read_bytes()).hexdigest();checks.append({'name':name,'expected_sha256':expected,'actual_sha256':actual,'match':expected==actual})
          required={'BodyFinder-dev20.19-universal.apk','body-finder-ruview-universal.apk','body-finder-ruview.aab','body-finder-ruview-legacy-minsdk21.apk','body-finder-node-linux-x86_64.tar.gz','body-finder-node-linux-x86_64.deb','body-finder-detector-linux-x86_64','body-finder-windows-wsl-x86_64.zip','body-finder-detector-windows-x86_64.exe','validate_dev20_19_prerun.py','validate_dev20_19_g10.py','validators-dev20.19.zip','TESTING_DEV20_19.md','SBOM.spdx.json','release-manifest.json','SHA256SUMS.txt','dev20_18_physical_prerun_no_go_reproduction.json','critical-control-budget-contract-report-dev20.19.json','calibration-current-binding-report-dev20.19.json','artifact-local-promotion-report-dev20.19.json','runstart-binding-report-dev20.19.json','distributed-fault-injection-report-dev20.19.json','soak-report-dev20.19.json','android-runtime-launch-smoke-dev20.19.json','validator-contract-parity-report-dev20.19.json','ci-test-evidence-dev20.19.json','engineering-go-dev20.19.json','g10-dev20.19.json','rollback-readiness-dev20.19.json'}
          names={p.name for p in d.iterdir() if p.is_file()};missing=required-names;assert not missing,missing
          manifest=json.loads((d/'release-manifest.json').read_text());assert manifest['source_sha']==sha and manifest['tag']=='dev-20.19'
          out={'schema':'ReleaseVerificationDev2019V1','tag':'dev-20.19','build':'0.2.0-experimental.20.19','source_sha':sha,'redownloaded_asset_count':len(names),'all_sha256_match':all(x['match'] for x in checks),'android_jni_packaging_verified':True,'required_inventory_present':True,'release_target_sha_verified':True,'all_published_assets_covered_by_sha256sums_after_upload':True,'engineering_go':True,'g10':'PHYSICAL_PENDING','final_go':False,'checks':checks,'pass':all(x['match'] for x in checks)}
          pathlib.Path('dist/release-verification-dev20.19.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');assert out['pass']
          PY
          sha256sum dist/release-verification-dev20.19.json | sed 's#dist/##' >> dist/SHA256SUMS.txt
          gh release upload dev-20.19 dist/release-verification-dev20.19.json dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          rm -rf verify-final && mkdir verify-final
          gh release download dev-20.19 --repo "$GITHUB_REPOSITORY" --dir verify-final
          cp verify-final/SHA256SUMS.txt /tmp/SHA256SUMS-final.txt
          (cd verify-final && sha256sum -c /tmp/SHA256SUMS-final.txt)
          echo DEV20_19_RELEASE_PUBLISHED_AND_INDEPENDENTLY_VERIFIED
