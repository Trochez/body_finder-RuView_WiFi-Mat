name: Dev12 validator migration

on:
  push:
    branches: [main]
    paths:
      - 'DEV12_BOOTSTRAP_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Migrate inherited validators to explicit dev12 version truth
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('validation/android')
          for p in root.glob('check_*.py'):
              if p.name in {'check_dev11_frozen_truth_contract.py','check_dev12_peer_starvation_contract.py'}:
                  continue
              s=p.read_text()
              s=s.replace('0.2.0-experimental.11','0.2.0-experimental.12')
              s=s.replace('Experimental.11','Experimental.12')
              s=s.replace('experimental.11','experimental.12')
              s=s.replace('dev11 version truth missing','dev12 version truth missing')
              s=s.replace('reportVersion: 13','reportVersion: 14')
              if p.name == 'check_version_truth_contract.py':
                  s=s.replace("cfg['android']['versionCode']==11","cfg['android']['versionCode']==12")
                  s=s.replace("cfg['extra']['releaseIteration']=='experimental.11'","cfg['extra']['releaseIteration']=='experimental.12'")
              p.write_text(s)
          PY
          python3 validation/android/check_android_ranging_contract.py
          python3 validation/android/check_ble_range_accuracy_contract.py
          python3 validation/android/check_ble_continuity_contract.py
          python3 validation/android/check_ble_acquisition_contract.py
          python3 validation/android/check_ble_adaptive_acquisition_contract.py
          python3 validation/android/check_validation_snapshot_contract.py
          python3 validation/android/check_acquisition_truth_contract.py
          python3 validation/android/check_validation_snapshot_v2_contract.py
          python3 validation/android/check_recovery_timeline_contract.py
          python3 validation/android/check_peer_telemetry_semantics.py
          python3 validation/android/check_geometry_snapshot_contract.py
          python3 validation/android/check_version_truth_contract.py
          python3 validation/android/check_dev11_frozen_truth_contract.py
          python3 validation/android/check_dev12_peer_starvation_contract.py
      - name: Commit validator migration
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/android
          git commit -m 'test: migrate inherited Android contracts to dev12 version truth'
          git push origin HEAD:main
