name: Bootstrap dev-12 implementation

on:
  push:
    branches: [main]
    paths:
      - 'DEV12_BOOTSTRAP_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bootstrap-dev12
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and apply dev-12 implementation
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p scripts
          cat .dev12-payload/part*.b64 | base64 -d | gzip -dc > scripts/apply_dev12.py
          echo '83d518e2f0d2bc7dbe477e8f558d53fd24ab58aeb74b824e82b08fa366d3c99f  scripts/apply_dev12.py' | sha256sum -c -
          python3 -m py_compile scripts/apply_dev12.py
          python3 scripts/apply_dev12.py
          python3 validation/android/check_dev12_peer_starvation_contract.py
          python3 -m py_compile validation/analysis/validate_dev12_hard_gates.py validation/analysis/validate_snapshot_immutability.py validation/analysis/validate_timeline_causality.py validation/analysis/validate_peer_semantics.py validation/analysis/validate_peer_starvation_recovery.py validation/analysis/validate_geometry_snapshot.py validation/analysis/calculate_accuracy_report.py validation/analysis/validate_release_manifest.py validation/analysis/build_acceptance_report.py
      - name: Commit dev-12 implementation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: implement dev12 per-peer starvation recovery and self-contained JSON evidence'
          git push origin HEAD:main
      - name: Dispatch dev-12 release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          sleep 3
          gh workflow run release-exp12.yml --ref main
