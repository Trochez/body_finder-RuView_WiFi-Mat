name: Bootstrap dev20.6 implementation

on:
  push:
    branches: [implementation/dev20.6]
    paths: [DEV20_6_BOOTSTRAP_TRIGGER.txt]

permissions:
  contents: write

concurrency:
  group: bootstrap-dev20-6
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/dev20.6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply dev20.6 remediation
        run: |
          set -euxo pipefail
          python3 scripts/apply_dev20_6_delta.py
          cargo fmt --all
      - name: Engineering verification
        run: |
          set -euxo pipefail
          python3 -m py_compile validation/analysis/validate_dev20_6_smoke.py validation/analysis/build_dev20_6_campaign.py validation/analysis/test_dev20_6_contract.py
          python3 validation/analysis/test_dev20_6_contract.py
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cd apps/mobile
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Commit verified implementation
        run: |
          set -euxo pipefail
          git config user.name 'body-finder-release-bot'
          git config user.email 'actions@github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated implementation delta'
            exit 1
          fi
          git commit -m 'feat(dev20.6): implement post-smoke no-go remediation'
          git push origin HEAD:implementation/dev20.6
