name: Fix dev20.11 UTF8

on:
  push:
    branches: [main]
    paths: [FIX_DEV20_11_UTF8_TRIGGER.txt]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make transformation IO platform-independent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/implement_dev20_11.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("def rd(p):return (R/p).read_text()", "def rd(p):return (R/p).read_text(encoding='utf-8')")
          s=s.replace("q=R/p;q.parent.mkdir(parents=True,exist_ok=True);q.write_text(s)", "q=R/p;q.parent.mkdir(parents=True,exist_ok=True);q.write_text(s,encoding='utf-8')")
          p.write_text(s,encoding='utf-8')
          compile(s,str(p),'exec')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/implement_dev20_11.py
          git diff --cached --check
          git commit -m "fix(dev20.11): use UTF-8 implementation IO on Windows"
          git push origin HEAD:main
