name: Dev12 target callback enforcement
on:
  push:
    branches: [release/dev12]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/dev12
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/dev12_target_fix.py
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
            git commit -m 'fix: require trigger peer for first valid recovery callback'
            git push origin HEAD:release/dev12
          fi
