name: Release dev20.14

on:
  push:
    branches: [main]
    paths: [RELEASE_DEV20_14_TRIGGER.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-dev20-14
  cancel-in-progress: true

env:
  BUILD_VERSION: 0.2.0-experimental.20.14

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows binaries
        run: cargo build --release -p body-finder-node -p body-finder-science --bins
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\win | Out-Null
          Copy-Item target\release\body-finder-node.exe dist\win\
          Copy-Item target\release\body-finder-detector.exe dist\win\
          if (Test-Path target\release\body-finder-replay.exe) { Copy-Item target\release\body-finder-replay.exe dist\win\ }
          if (Test-Path target\release\body-finder-validate-session.exe) { Copy-Item target\release\body-finder-validate-session.exe dist\win\ }
          if (Test-Path target\release\body-finder-rf-recorder.exe) { Copy-Item target\release\body-finder-rf-recorder.exe dist\win\ }
          Copy-Item target\release\body-finder-detector.exe dist\body-finder-detector-windows-x86_64.exe
          Compress-Archive dist\win\* dist\body-finder-windows-wsl-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dev20-14-windows
          path: |
            dist/body-finder-windows-wsl-x86_64.zip
            dist/body-finder-detector-windows-x86_64.exe

  build-release:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - uses: actions/download-artifact@v4
        with:
          name: dev20-14-windows
          path: dist

      - name: R0-R5 engineering gates
        run: |
          set -euxo pipefail
          grep -q "0.2.0-experimental.20.14" apps/mobile/src/version.ts
          grep -q "reportVersion: 34" apps/mobile/src/version.ts
          grep -q "versionCode: 34" apps/mobile/src/version.ts
          grep -q "AuthorityWireV2" apps/mobile/src/authority.ts
          grep -q "AuthorityAckWireV2" apps/mobile/src/authority.ts
          ! grep -Fq "instance_epoch??'legacy'" apps/mobile/src/authority.ts
          grep -q 'put("instance_epoch", FabricRuntime.instanceEpoch)' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          python3 -m py_compile validation/analysis/test_dev20_14_remediation.py validation/analysis/validate_dev20_14_g10.py
          python3 validation/analysis/test_dev20_14_remediation.py
          python3 - <<'PY'
          import json,pathlib
          fixtures=list(pathlib.Path('validation/fixtures/dev20_14').glob('dev20_13_physical_node_*.json'))
          assert len(fixtures)==3
          rows=[json.loads(p.read_text()) for p in fixtures]
          assert {x['authority_view_send_failures'] for x in rows}=={384,775,868}
          assert all(x['authority_ack_count']==1 and x['critical_control_payload_target_bytes']==600 and x['authority_view_payload_bytes']==673 for x in rows)
          for p in pathlib.Path('validation/schemas').glob('*.json'): json.loads(p.read_text())
          PY
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo build --release -p body-finder-node -p body-finder-science --bins
          cd apps/mobile
          npm ci --no-audit --no-fund
          npm run typecheck
          CI=1 npx expo prebuild --platform android --clean
          chmod +x android/gradlew
          ./android/gradlew -p android testReleaseUnitTest --stacktrace
          cd ../..
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Package Linux
        run: |
          set -euxo pipefail
          mkdir -p dist work/deb/DEBIAN work/deb/usr/bin
          tar -C target/release -czf dist/body-finder-node-linux-x86_64.tar.gz body-finder-node
          cp target/release/body-finder-node work/deb/usr/bin/
          printf 'Package: body-finder-node\nVersion: 0.2.0~experimental20.14\nSection: science\nPriority: optional\nArchitecture: amd64\nMaintainer: Trochez\nDescription: Body Finder RuView field node\n' > work/deb/DEBIAN/control
          dpkg-deb --build work/deb dist/body-finder-node-linux-x86_64.deb
          cp target/release/body-finder-detector dist/body-finder-detector-linux-x86_64
          chmod +x dist/body-finder-detector-linux-x86_64

      - name: Build Android universal APK and AAB
        run: |
          set -euxo pipefail
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
          rm -rf apps/mobile/modules/body-finder-native/android/src/main/jniLibs
          mkdir -p apps/mobile/modules/body-finder-native/android/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o apps/mobile/modules/body-finder-native/android/src/main/jniLibs build --release -p body-finder-science --lib
          cd apps/mobile
          ./android/gradlew -p android assembleRelease bundleRelease --stacktrace
          cd ../..
          cp apps/mobile/android/app/build/outputs/apk/release/*.apk dist/body-finder-ruview-universal.apk
          cp dist/body-finder-ruview-universal.apk dist/BodyFinder-dev20.14-universal.apk
          cp apps/mobile/android/app/build/outputs/bundle/release/*.aab dist/body-finder-ruview.aab

      - name: Build Android legacy minSdk21 APK
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000; fi
          cd apps/android-legacy
          gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace
          cd ../..
          cp apps/android-legacy/app/build/outputs/apk/release/*.apk dist/body-finder-ruview-legacy-minsdk21.apk

      - name: Package validators, schemas, reports and fixtures
        run: |
          set -euxo pipefail
          cp TESTING_DEV20_14.md dist/
          cp validation/analysis/validate_dev20_14_g10.py dist/
          cp validation/schemas/authority-wire-v2-schema.json validation/schemas/authority-ack-wire-v2-schema.json dist/
          for f in pre-run-diagnostic-v1-schema.json authority-view-v1-schema.json control-plane-v11-schema.json wire-transport-telemetry-v13-schema.json range-frame-v9-schema.json geometry-publication-v11-schema.json artifact-manifest-v4-schema.json scenario-command-v1-schema.json run-start-v1-schema.json snapshot-freeze-v2-schema.json; do [ ! -f validation/schemas/$f ] || cp validation/schemas/$f dist/$f; done
          for f in authority-convergence-report.json authority-wire-budget-report.json instance-epoch-canonicalization-report.json distributed-fault-injection-report.json geometry-network-raging-fallback-report.json rollback-readiness.json g10-dev20.14.json; do cp validation/reports/$f dist/$f; done
          rm -rf kit fixturepack
          mkdir -p kit/validation/analysis kit/validation/schemas kit/validation/reports fixturepack/dev20_14
          cp validation/analysis/test_dev20_14_remediation.py validation/analysis/validate_dev20_14_g10.py kit/validation/analysis/
          cp validation/schemas/authority-wire-v2-schema.json validation/schemas/authority-ack-wire-v2-schema.json kit/validation/schemas/
          cp validation/reports/authority-convergence-report.json validation/reports/authority-wire-budget-report.json validation/reports/instance-epoch-canonicalization-report.json validation/reports/distributed-fault-injection-report.json validation/reports/geometry-network-raging-fallback-report.json validation/reports/rollback-readiness.json validation/reports/g10-dev20.14.json kit/validation/reports/
          cp TESTING_DEV20_14.md kit/
          cp validation/fixtures/dev20_14/*.json fixturepack/dev20_14/
          (cd kit && zip -qr ../dist/validators-dev20.14.zip .)
          (cd fixturepack && zip -qr ../dist/fixtures-dev20.14.zip dev20_14)
          python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path('dist')
          eng={'schema':'engineering-go-dev20.14-v1','release':'dev-20.14','source_sha':os.environ['SOURCE_SHA'],'r0_reproduction':True,'r1_identity_canonicalization':True,'r2_wire_budget':True,'r3_distributed_authority':True,'r4_secondary_runtime_hardening':True,'r5_engineering_go':True,'r6_release_integrity':'VERIFYING','engineering_go':True,'g10':'PHYSICAL_PENDING','g11':'BLOCKED','dev21':'BLOCKED','screenshots_required':False}
          (d/'engineering-go.json').write_text(json.dumps(eng,indent=2,sort_keys=True)+'\n')
          ver={'schema':'release-verification-dev20.14-v1','release':'dev-20.14','build':os.environ['BUILD_VERSION'],'source_sha':os.environ['SOURCE_SHA'],'engineering_go':True,'g10':'PHYSICAL_PENDING','g11':'BLOCKED','dev21':'BLOCKED','screenshots_required':False,'release_redownload_sha_verified':False,'redownload_asset_count':0}
          (d/'release-verification.json').write_text(json.dumps(ver,indent=2,sort_keys=True)+'\n')
          PY

      - uses: anchore/sbom-action@v0
        with:
          path: '.'
          format: spdx-json
          output-file: dist/SBOM.spdx.json

      - name: Create release manifest and checksums
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          d=pathlib.Path('dist')
          required=['BodyFinder-dev20.14-universal.apk','body-finder-ruview-universal.apk','body-finder-ruview-legacy-minsdk21.apk','body-finder-ruview.aab','body-finder-node-linux-x86_64.tar.gz','body-finder-node-linux-x86_64.deb','body-finder-windows-wsl-x86_64.zip','body-finder-detector-linux-x86_64','body-finder-detector-windows-x86_64.exe','validators-dev20.14.zip','fixtures-dev20.14.zip','engineering-go.json','authority-convergence-report.json','authority-wire-budget-report.json','instance-epoch-canonicalization-report.json','distributed-fault-injection-report.json','geometry-network-raging-fallback-report.json','rollback-readiness.json','release-verification.json','g10-dev20.14.json','SBOM.spdx.json','TESTING_DEV20_14.md','validate_dev20_14_g10.py','authority-wire-v2-schema.json','authority-ack-wire-v2-schema.json']
          missing=[x for x in required if not (d/x).is_file() or (d/x).stat().st_size==0]
          if missing: raise SystemExit('missing/empty release assets: '+str(missing))
          assets=sorted(p.name for p in d.iterdir() if p.is_file())
          manifest={'schema':'release-manifest-dev20.14-v1','release':'dev-20.14','source_sha':os.environ['SOURCE_SHA'],'asset_count_before_sha':len(assets)+1,'assets_before_sha':assets,'required_assets':required}
          (d/'release-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          files=sorted(p for p in d.iterdir() if p.is_file())
          (d/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY

      - name: Publish prerelease, redownload and independently verify R6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          trap 'gh release delete dev-20.14 -y || true; git push origin :refs/tags/dev-20.14 || true' ERR
          git tag -f dev-20.14 "$SOURCE_SHA"
          git push origin refs/tags/dev-20.14 --force
          gh release delete dev-20.14 -y || true
          gh release create dev-20.14 dist/* --prerelease --target "$SOURCE_SHA" --title 'dev-20.14 — Physical NO-GO remediation' --notes 'Engineering R0-R6 GO. Physical R7/R8/G10 remains PHYSICAL_PENDING until exactly six >=330s Android acceptance JSONs pass validate_dev20_14_g10.py. Screenshots are not required.'
          rm -rf verify && mkdir verify
          (cd verify && gh release download dev-20.14)
          (cd verify && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import json,pathlib
          d=pathlib.Path('dist');v=json.loads((d/'release-verification.json').read_text());v['release_redownload_sha_verified']=True;v['redownload_asset_count']=len(list(pathlib.Path('verify').iterdir()));v['r6_release_integrity']=True;(d/'release-verification.json').write_text(json.dumps(v,indent=2,sort_keys=True)+'\n')
          e=json.loads((d/'engineering-go.json').read_text());e['r6_release_integrity']=True;e['engineering_go']=True;(d/'engineering-go.json').write_text(json.dumps(e,indent=2,sort_keys=True)+'\n')
          PY
          python3 - <<'PY'
          import hashlib,pathlib
          d=pathlib.Path('dist');files=sorted(p for p in d.iterdir() if p.is_file() and p.name!='SHA256SUMS.txt');(d/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
          gh release upload dev-20.14 dist/engineering-go.json dist/release-verification.json dist/SHA256SUMS.txt --clobber
          rm -rf verify-final && mkdir verify-final
          (cd verify-final && gh release download dev-20.14)
          (cd verify-final && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import json,pathlib
          v=json.loads(pathlib.Path('verify-final/release-verification.json').read_text());e=json.loads(pathlib.Path('verify-final/engineering-go.json').read_text())
          assert v['release_redownload_sha_verified'] is True and v['r6_release_integrity'] is True
          assert e['engineering_go'] is True and e['r6_release_integrity'] is True and e['g10']=='PHYSICAL_PENDING'
          print('R6_RELEASE_INTEGRITY_GO assets=',len(list(pathlib.Path('verify-final').iterdir())))
          PY
