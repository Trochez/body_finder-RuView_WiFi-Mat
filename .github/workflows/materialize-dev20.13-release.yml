name: Materialize dev20.13 release workflow

on:
  push:
    branches: [main]
    paths: [MATERIALIZE_DEV20_13_RELEASE.txt]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate exact release workflow as normal text artifact
        run: |
          set -euxo pipefail
          python3 scripts/implement_dev20_13.py
          python3 scripts/dev20_13_post_patch.py
          test -s .github/workflows/release-dev20.13.yml
          cp .github/workflows/release-dev20.13.yml GENERATED_RELEASE_DEV20_13.yml.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add GENERATED_RELEASE_DEV20_13.yml.txt
          git commit -m "ci(dev20.13): materialize exact release workflow text"
          git push origin HEAD:main
