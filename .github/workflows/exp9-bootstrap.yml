name: Exp9 Bootstrap

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/ble-adaptive-acquisition-recovery-exp9]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/ble-adaptive-acquisition-recovery-exp9' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ble-adaptive-acquisition-recovery-exp9
          fetch-depth: 0
      - name: Assemble and apply experimental.9 transformation
        shell: bash
        run: |
          set -euxo pipefail
          cat tools/exp9_parts/00 tools/exp9_parts/01 tools/exp9_parts/02 tools/exp9_parts/03 tools/exp9_parts/04 tools/exp9_parts/05 tools/exp9_parts/06 tools/exp9_parts/07 tools/exp9_parts/08 tools/exp9_parts/09 > /tmp/apply_exp9_plan.py
          python3 -m py_compile /tmp/apply_exp9_plan.py
          python3 /tmp/apply_exp9_plan.py
          python3 validation/android/check_ble_adaptive_acquisition_contract.py
      - name: Commit implementation without workflow files
        shell: bash
        run: |
          set -euxo pipefail
          git restore .github/workflows/ci.yml .github/workflows/release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Implement experimental.9 adaptive BLE acquisition recovery'
          git push origin HEAD:feat/ble-adaptive-acquisition-recovery-exp9
