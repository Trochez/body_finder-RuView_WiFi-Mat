name: Bootstrap dev10 implementation
on:
  push:
    branches: [feat/dev10-validation-integrity]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bootstrap-dev10-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dev10-validation-integrity
      - name: Assemble and apply dev10 transformation
        shell: bash
        run: |
          set -euxo pipefail
          cat scripts/maintenance/dev10_core_00.txt scripts/maintenance/dev10_core_01.txt scripts/maintenance/dev10_core_02.txt > scripts/maintenance/apply_dev10_core.py
          python3 -m py_compile scripts/maintenance/apply_dev10_core.py
          python3 scripts/maintenance/apply_dev10_core.py
          python3 -m py_compile validation/android/check_validation_snapshot_contract.py validation/android/check_acquisition_truth_contract.py validation/analysis/compare_validation_snapshots.py
          python3 validation/android/check_validation_snapshot_contract.py
          python3 validation/android/check_acquisition_truth_contract.py
          python3 -m json.tool protocol/schemas/validation-run-snapshot-v1.json >/dev/null
          python3 -m json.tool validation/fixtures/validation-snapshot/dev9-post-end-drift.json >/dev/null
      - name: Commit implementation
        shell: bash
        run: |
          set -euxo pipefail
          rm -f scripts/maintenance/dev10_core_00.txt scripts/maintenance/dev10_core_01.txt scripts/maintenance/dev10_core_02.txt scripts/maintenance/apply_dev10_core.py .github/workflows/bootstrap-dev10.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement dev10 validation integrity and recovery provenance'
          git push origin HEAD:feat/dev10-validation-integrity
