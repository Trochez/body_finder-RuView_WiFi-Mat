name: Dev14 validation and release bootstrap

on:
  push:
    branches: [main]
    paths: ['DEV14_BOOTSTRAP_TRIGGER.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-dev14
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply dev14 plan
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/apply_dev14.py
          python3 scripts/apply_dev14.py
      - name: Deterministic dev14 gates
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile validation/analysis/dev14_validation.py validation/analysis/validate_dev14_hard_gates.py validation/analysis/validate_dev14_fixture_matrix.py validation/analysis/validate_timeline_causality.py validation/analysis/validate_peer_starvation_recovery.py validation/analysis/validate_environment_intervals.py validation/analysis/validate_release_manifest.py validation/android/check_dev14_recovery_contract.py validation/android/check_dev14_environment_contract.py validation/android/test_dev14_recovery_model.py
          python3 validation/android/check_dev14_recovery_contract.py
          python3 validation/android/check_dev14_environment_contract.py
          python3 validation/android/test_dev14_recovery_model.py
          python3 validation/analysis/validate_dev14_fixture_matrix.py
          python3 validation/analysis/validate_environment_authorization.py
          python3 validation/analysis/validate_preflight_snapshot.py
          python3 -m json.tool protocol/schemas/validation-run-snapshot-v3.json >/dev/null
          cargo test --workspace
          grep -q "0.2.0-experimental.14" apps/mobile/src/version.ts
          grep -q "reportVersion: 16" apps/mobile/src/version.ts
          grep -q '"versionCode": 14' apps/mobile/app.json
          grep -q '"releaseIteration": "experimental.14"' apps/mobile/app.json
          test -s DEV14_FROZEN_TRUTH.md
          test -s docs/TESTING_DEV14.md
          grep -qi 'No screenshots are required' docs/TESTING_DEV14.md
          test -s .github/workflows/release-exp14.yml
      - name: Commit dev14 implementation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps validation protocol docs DEV14_FROZEN_TRUTH.md .github/workflows/release-exp14.yml scripts/apply_dev14.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat: implement dev14 recovery atomicity and lifecycle evidence'
            git push origin HEAD:main
          fi
