name: Dev Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce experimental.8 release contracts
        shell: bash
        run: |
          set -euo pipefail
          BAD=$(grep -R -n -E -- '(--x([ =]|$)|--y([ =]|$)|SET MEASURED POSITION|Set position|Guardar posición|x meters|y meters)' apps/mobile/App.tsx apps/node/src/main.rs apps/android-legacy/app/src/main/java || true)
          if [ -n "$BAD" ]; then echo "$BAD"; exit 1; fi
          grep -q 'pub const PROTOCOL_VERSION: u16 = 2;' crates/body-finder-core/src/lib.rs
          grep -q 'manual_geometry_override.*false' apps/mobile/App.tsx
          grep -q '0.2.0-experimental.8' apps/mobile/App.tsx
          grep -q 'HUMAN_SCANNING_ENABLED = false' apps/mobile/App.tsx
          grep -q 'android-ble-lab-v1' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BleRangeEstimator.kt
          grep -q 'BleRangeTemporalState.HOLDOVER' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BleContinuityPolicy.kt
          grep -q 'LOW_LATENCY_SOFTWARE_FILTERED_ALL_MATCHES' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BleAcquisitionPolicy.kt
          grep -q 'MATCH_MODE_AGGRESSIVE' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BleAcquisitionPolicy.kt
          grep -q 'BLE_ACQUISITION_YIELD' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/SystemRangingApi36.kt
          grep -q 'OUT_OF_DOMAIN_HIGH' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BleRangeEstimator.kt
          grep -q 'RECIPROCAL_INVERSE_VARIANCE' apps/mobile/src/rangeFusion.ts
          grep -q 'geometry_temporal_quality' apps/mobile/src/geometryDiagnostics.ts
          grep -q 'FOREGROUND_SERVICE_CONNECTED_DEVICE' apps/mobile/app.json
          python3 validation/android/check_android_ranging_contract.py
          python3 validation/android/check_ble_range_accuracy_contract.py
          python3 validation/android/check_ble_continuity_contract.py
          python3 validation/android/check_ble_acquisition_contract.py
          test -s IMPLEMENTATION_PLAN_AUTOGEOMETRY_RELEASE.md
          test -s IMPLEMENTATION_PLAN_ANDROID_RANGING_STABILIZATION.md
          test -s IMPLEMENTATION_PLAN_BLE_RANGE_ACCURACY_AND_ANDROID_LIFECYCLE.md
          test -s IMPLEMENTATION_PLAN_ANDROID_BLE_LAB_V1_METRIC.md
          test -s IMPLEMENTATION_PLAN_BLE_METRIC_CONTINUITY_STABILIZATION.md
          test -s IMPLEMENTATION_PLAN_BLE_ACQUISITION_CONTINUITY.md
          test -s docs/TESTING_AUTOGEOMETRY_RELEASE.md
          test -s docs/ANDROID_RANGING_RETEST.md
          test -s docs/ANDROID_RANGE_PRECISION_RETEST.md
          test -s docs/ANDROID_POWER_LIFECYCLE_RETEST.md
          test -s docs/ANDROID_BLE_METRIC_GEOMETRY_RETEST.md
          test -s docs/ANDROID_BLE_METRIC_CONTINUITY_RETEST.md
          test -s docs/ANDROID_BLE_ACQUISITION_CONTINUITY_RETEST.md
          python3 -m json.tool docs/CAPABILITY_MATRIX_AUTOGEOMETRY.json >/dev/null
          python3 -m json.tool protocol/schemas/autogeometry-v2.json >/dev/null
          python3 -m json.tool calibration/ble-range-calibration-schema.json >/dev/null
          python3 -m json.tool calibration/ble-range-calibration-profiles.json >/dev/null
          python3 -m json.tool validation/fixtures/ble-range/t2-t4b-screening.json >/dev/null
          python3 -m json.tool validation/fixtures/ble-range/p0c-calibration-summary.json >/dev/null
          python3 -m json.tool validation/fixtures/ble-continuity/dev6-continuity-baseline.json >/dev/null
          python3 -m json.tool validation/fixtures/ble-acquisition/experimental7-physical-baseline.json >/dev/null
          python3 -m py_compile validation/analysis/validate_autogeometry.py validation/analysis/fit_ble_range_profile.py validation/android/check_android_ranging_contract.py validation/android/check_ble_range_accuracy_contract.py validation/android/check_ble_continuity_contract.py validation/android/check_ble_acquisition_contract.py

  linux-x86_64:
    needs: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p body-finder-node
      - name: Package Linux
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/tar dist/deb/usr/bin dist/deb/DEBIAN
          cp target/release/body-finder-node dist/tar/body-finder-node
          cp target/release/body-finder-node dist/deb/usr/bin/body-finder-node
          chmod +x dist/tar/body-finder-node dist/deb/usr/bin/body-finder-node
          tar -C dist/tar -czf dist/body-finder-node-linux-x86_64.tar.gz body-finder-node
          cat > dist/deb/DEBIAN/control <<'EOF'
          Package: body-finder-node
          Version: 0.2.0~experimental8
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: Trochez
          Description: Experimental Body Finder RuView automatic-geometry field sensing/compute node
          EOF
          dpkg-deb --build dist/deb dist/body-finder-node-linux-x86_64.deb
          rm -rf dist/tar dist/deb
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error

  windows-x86_64:
    needs: requirements
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p body-finder-node
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\win | Out-Null
          Copy-Item target\release\body-finder-node.exe dist\win\body-finder-node.exe
          Compress-Archive -Path dist\win\body-finder-node.exe -DestinationPath dist\body-finder-node-windows-x86_64.zip
          if (!(Test-Path dist\body-finder-node-windows-x86_64.zip)) { throw 'Windows artifact missing' }
          Remove-Item -Recurse -Force dist\win
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  android:
    needs: requirements
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx tsc --noEmit
      - run: CI=1 npx expo prebuild --platform android --clean
      - name: Verify Android field permissions and service
        shell: bash
        run: |
          set -euo pipefail
          APP_MANIFEST=android/app/src/main/AndroidManifest.xml
          MODULE_MANIFEST=modules/body-finder-native/android/src/main/AndroidManifest.xml
          for P in BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_SCAN BLUETOOTH_CONNECT BLUETOOTH_ADVERTISE WAKE_LOCK FOREGROUND_SERVICE FOREGROUND_SERVICE_CONNECTED_DEVICE CHANGE_WIFI_MULTICAST_STATE; do
            grep -q "android.permission.${P}" "$APP_MANIFEST"
          done
          grep -q 'BodyFinderFieldService' "$MODULE_MANIFEST"
          grep -q 'android:foregroundServiceType="connectedDevice"' "$MODULE_MANIFEST"
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleRelease bundleRelease --stacktrace
        working-directory: apps/mobile/android
      - name: Verify service in merged release manifest
        shell: bash
        run: |
          set -euo pipefail
          MERGED=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml -type f -exec grep -l 'BodyFinderFieldService' {} \; | head -n 1)
          test -n "$MERGED"
          grep -q 'BodyFinderFieldService' "$MERGED"
          grep -q 'foregroundServiceType="connectedDevice"' "$MERGED"
      - name: Normalize Android artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ../../dist
          cp android/app/build/outputs/apk/release/*.apk ../../dist/body-finder-ruview-universal.apk
          cp android/app/build/outputs/bundle/release/*.aab ../../dist/body-finder-ruview.aab
          test -s ../../dist/body-finder-ruview-universal.apk
          test -s ../../dist/body-finder-ruview.aab
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  android-legacy:
    needs: requirements
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Create internal-test signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - run: gradle :app:assembleRelease --stacktrace
      - name: Normalize legacy APK
        shell: bash
        run: |
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/*.apk ../../dist/body-finder-ruview-legacy-minsdk21.apk
          test -s ../../dist/body-finder-ruview-legacy-minsdk21.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-legacy
          path: dist/*
          if-no-files-found: error

  ios-simulator:
    needs: requirements
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npx tsc --noEmit
      - run: CI=1 npx expo prebuild --platform ios --clean
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Build and package unsigned iOS Simulator app
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euxo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | ruby -rjson -e 'j=JSON.parse(STDIN.read); schemes=j.fetch("workspace").fetch("schemes"); p="BodyFinderRuView"; abort("scheme missing") unless schemes.include?(p); puts p')
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP=$(find build/Build/Products -type d -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/dist/body-finder-ruview-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios-simulator
          path: dist/*
          if-no-files-found: error

  release:
    needs: [requirements, linux-x86_64, windows-x86_64, android, android-legacy, ios-simulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Add validation kit, acquisition fixtures and manifests
        shell: bash
        run: |
          set -euxo pipefail
          cp docs/TESTING_AUTOGEOMETRY_RELEASE.md dist/TESTING_AUTOGEOMETRY_RELEASE.md
          cp docs/ANDROID_RANGING_RETEST.md dist/ANDROID_RANGING_RETEST.md
          cp docs/ANDROID_RANGE_PRECISION_RETEST.md dist/ANDROID_RANGE_PRECISION_RETEST.md
          cp docs/ANDROID_POWER_LIFECYCLE_RETEST.md dist/ANDROID_POWER_LIFECYCLE_RETEST.md
          cp docs/ANDROID_BLE_METRIC_GEOMETRY_RETEST.md dist/ANDROID_BLE_METRIC_GEOMETRY_RETEST.md
          cp docs/ANDROID_BLE_METRIC_CONTINUITY_RETEST.md dist/ANDROID_BLE_METRIC_CONTINUITY_RETEST.md
          cp docs/ANDROID_BLE_ACQUISITION_CONTINUITY_RETEST.md dist/ANDROID_BLE_ACQUISITION_CONTINUITY_RETEST.md
          cp docs/CAPABILITY_MATRIX_AUTOGEOMETRY.json dist/capability-matrix.json
          cp IMPLEMENTATION_PLAN_AUTOGEOMETRY_RELEASE.md dist/IMPLEMENTATION_PLAN_AUTOGEOMETRY_RELEASE.md
          cp IMPLEMENTATION_PLAN_ANDROID_RANGING_STABILIZATION.md dist/IMPLEMENTATION_PLAN_ANDROID_RANGING_STABILIZATION.md
          cp IMPLEMENTATION_PLAN_BLE_RANGE_ACCURACY_AND_ANDROID_LIFECYCLE.md dist/IMPLEMENTATION_PLAN_BLE_RANGE_ACCURACY_AND_ANDROID_LIFECYCLE.md
          cp IMPLEMENTATION_PLAN_ANDROID_BLE_LAB_V1_METRIC.md dist/IMPLEMENTATION_PLAN_ANDROID_BLE_LAB_V1_METRIC.md
          cp IMPLEMENTATION_PLAN_BLE_METRIC_CONTINUITY_STABILIZATION.md dist/IMPLEMENTATION_PLAN_BLE_METRIC_CONTINUITY_STABILIZATION.md
          cp IMPLEMENTATION_PLAN_BLE_ACQUISITION_CONTINUITY.md dist/IMPLEMENTATION_PLAN_BLE_ACQUISITION_CONTINUITY.md
          cp calibration/ble-range-calibration-profiles.json dist/ble-range-calibration-profiles.json
          cp calibration/ble-range-calibration-schema.json dist/ble-range-calibration-schema.json
          cp upstream/ruvieW.lock.json dist/ruview-upstream-lock.json
          printf '2\n' > dist/protocol-version.txt

          cat > dist/model-manifest.json <<'EOF'
          {
            "schema_version": 1,
            "release_family": "0.2.0-experimental.8",
            "models": [],
            "note": "No pretrained human-localization model is bundled. android-ble-lab-v1 remains frozen at physically calibrated COARSE BLE RSSI parameters valid only for 0.5-5.0 m. experimental.8 changes Android BLE acquisition continuity only; human/rescue performance remains unvalidated."
          }
          EOF

          mkdir -p dist/validation-kit
          cp validation/analysis/validate_autogeometry.py dist/validation-kit/
          cp validation/analysis/fit_ble_range_profile.py dist/validation-kit/
          cp validation/ground-truth/GROUND_TRUTH_TEMPLATE.json dist/validation-kit/
          cp protocol/schemas/autogeometry-v2.json dist/validation-kit/autogeometry-v2.schema.json
          cp calibration/ble-range-calibration-schema.json dist/validation-kit/
          cp calibration/ble-range-calibration-profiles.json dist/validation-kit/
          cp validation/android/check_ble_continuity_contract.py dist/validation-kit/
          cp validation/android/check_ble_acquisition_contract.py dist/validation-kit/
          cp docs/ANDROID_BLE_ACQUISITION_CONTINUITY_RETEST.md dist/validation-kit/
          cp docs/ANDROID_BLE_METRIC_CONTINUITY_RETEST.md dist/validation-kit/
          cp docs/ANDROID_BLE_METRIC_GEOMETRY_RETEST.md dist/validation-kit/
          cp docs/ANDROID_POWER_LIFECYCLE_RETEST.md dist/validation-kit/
          (cd dist/validation-kit && zip -r ../body-finder-validation-tools.zip .)
          rm -rf dist/validation-kit

          mkdir -p dist/calibration-fixtures
          cp validation/fixtures/ble-range/*.json dist/calibration-fixtures/
          cp validation/android/check_ble_range_accuracy_contract.py dist/calibration-fixtures/
          (cd dist/calibration-fixtures && zip -r ../ble-range-calibration-fixtures.zip .)
          rm -rf dist/calibration-fixtures

          mkdir -p dist/continuity-fixtures
          cp validation/fixtures/ble-continuity/*.json dist/continuity-fixtures/
          cp validation/android/check_ble_continuity_contract.py dist/continuity-fixtures/
          (cd dist/continuity-fixtures && zip -r ../ble-continuity-regression-fixtures.zip .)
          rm -rf dist/continuity-fixtures

          mkdir -p dist/acquisition-fixtures
          cp validation/fixtures/ble-acquisition/*.json dist/acquisition-fixtures/
          cp validation/android/check_ble_acquisition_contract.py dist/acquisition-fixtures/
          (cd dist/acquisition-fixtures && zip -r ../ble-acquisition-regression-fixtures.zip .)
          rm -rf dist/acquisition-fixtures

          mkdir -p dist/android-ranging-fixtures
          cp validation/fixtures/android-ranging/*.json dist/android-ranging-fixtures/
          cp validation/android/check_android_ranging_contract.py dist/android-ranging-fixtures/
          (cd dist/android-ranging-fixtures && zip -r ../android-ranging-diagnostics-fixtures.zip .)
          rm -rf dist/android-ranging-fixtures

          cat > dist/IOS_PHYSICAL_DEVICE_SIGNING_REQUIRED.txt <<'EOF'
          This prerelease contains an unsigned iOS Simulator build only. Physical iOS RF/fabric participation is not validated by experimental.8 and requires Apple signing plus physical adapter implementation/validation.
          EOF

          cat > dist/release-manifest.json <<EOF
          {
            "schema_version": 7,
            "release": "dev-${GITHUB_RUN_NUMBER}",
            "commit": "${GITHUB_SHA}",
            "version": "0.2.0-experimental.8",
            "protocol_version": 2,
            "classification": "EXPERIMENTAL_VALIDATED_COARSE_BLE_METRIC_WITH_ACQUISITION_CONTINUITY",
            "automatic_geometry": true,
            "manual_node_coordinates_required": false,
            "ble_metric_profile": "android-ble-lab-v1",
            "ble_metric_profile_validated": true,
            "ble_metric_profile_physical_confidence": "COARSE",
            "ble_metric_rssi_at_1m_dbm": -69.19,
            "ble_metric_path_loss_exponent": 3.62,
            "ble_metric_valid_distance_min_m": 0.5,
            "ble_metric_valid_distance_max_m": 5.0,
            "ble_metric_min_samples": 3,
            "ble_metric_calibration_mae_m": 0.85,
            "ble_metric_calibration_max_error_m": 2.58,
            "dev6_three_node_pairwise_mae_m": 0.322,
            "dev6_three_node_max_pair_error_m": 0.496,
            "ble_reciprocal_fusion": true,
            "ble_reciprocal_fusion_mode": "INVERSE_VARIANCE_WITH_DISAGREEMENT_GATING",
            "ble_valid_rssi_prequeue_filter": true,
            "ble_invalid_rssi_127_filtered": true,
            "ble_raw_valid_invalid_sample_counters": true,
            "ble_last_valid_range_holdover": true,
            "ble_holdover_bounded": true,
            "ble_fresh_ms": 5000,
            "ble_holdover_max_ms": 10000,
            "ble_hard_expiry_ms": 10000,
            "ble_holdover_sigma_aging": true,
            "ble_holdover_sigma_aging_m_per_s": 0.15,
            "ble_holdover_sigma_cap_m": 5.0,
            "ble_scan_strategy": "LOW_LATENCY_SOFTWARE_FILTERED_ALL_MATCHES",
            "ble_primary_hardware_filter_count": 0,
            "ble_scan_match_mode_api23_plus": "AGGRESSIVE",
            "ble_scan_num_matches_api23_plus": "MAX_ADVERTISEMENT",
            "ble_scan_report_delay_ms": 0,
            "ble_interarrival_diagnostics": true,
            "ble_gap_thresholds_ms": [1000, 2000, 5000, 10000],
            "ble_scan_gap_classification": true,
            "ble_global_scanner_stall_only_restart": true,
            "android_api36_ranging_real_distance_only_resets_failure": true,
            "android_api36_ranging_ble_acquisition_yield": true,
            "android_api36_ranging_ble_yield_ms": 120000,
            "ble_metric_distance_silent_clamp_removed": true,
            "ble_out_of_domain_metric_policy": "DISTANCE_NULL_EXCLUDED_FROM_METRIC_GEOMETRY_AND_INVALIDATES_HOLDOVER",
            "validation_run_metrics": true,
            "validation_export_auto_finalizes_active_run": true,
            "android_foreground_field_session": true,
            "android_power_lifecycle_diagnostics": true,
            "human_scanning_enabled": false,
            "human_localization_validated": false,
            "through_wall_validated": false,
            "rescue_use_validated": false,
            "artifacts": [
              "body-finder-ruview-universal.apk",
              "body-finder-ruview.aab",
              "body-finder-ruview-legacy-minsdk21.apk",
              "body-finder-node-linux-x86_64.tar.gz",
              "body-finder-node-linux-x86_64.deb",
              "body-finder-node-windows-x86_64.zip",
              "body-finder-ruview-ios-simulator.zip",
              "ANDROID_BLE_ACQUISITION_CONTINUITY_RETEST.md",
              "ANDROID_BLE_METRIC_CONTINUITY_RETEST.md",
              "ANDROID_BLE_METRIC_GEOMETRY_RETEST.md",
              "ANDROID_RANGE_PRECISION_RETEST.md",
              "ANDROID_POWER_LIFECYCLE_RETEST.md",
              "ANDROID_RANGING_RETEST.md",
              "TESTING_AUTOGEOMETRY_RELEASE.md",
              "IMPLEMENTATION_PLAN_AUTOGEOMETRY_RELEASE.md",
              "IMPLEMENTATION_PLAN_ANDROID_RANGING_STABILIZATION.md",
              "IMPLEMENTATION_PLAN_BLE_RANGE_ACCURACY_AND_ANDROID_LIFECYCLE.md",
              "IMPLEMENTATION_PLAN_ANDROID_BLE_LAB_V1_METRIC.md",
              "IMPLEMENTATION_PLAN_BLE_METRIC_CONTINUITY_STABILIZATION.md",
              "IMPLEMENTATION_PLAN_BLE_ACQUISITION_CONTINUITY.md",
              "ble-range-calibration-profiles.json",
              "ble-range-calibration-schema.json",
              "ble-range-calibration-fixtures.zip",
              "ble-continuity-regression-fixtures.zip",
              "ble-acquisition-regression-fixtures.zip",
              "body-finder-validation-tools.zip",
              "android-ranging-diagnostics-fixtures.zip",
              "capability-matrix.json",
              "release-manifest.json",
              "protocol-version.txt",
              "ruview-upstream-lock.json",
              "model-manifest.json",
              "IOS_PHYSICAL_DEVICE_SIGNING_REQUIRED.txt",
              "SBOM.spdx.json",
              "SHA256SUMS"
            ]
          }
          EOF
          python3 -m json.tool dist/release-manifest.json >/dev/null
          python3 -m json.tool dist/model-manifest.json >/dev/null

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/SBOM.spdx.json

      - name: Assert mandatory artifacts and manifest truth
        shell: bash
        run: |
          set -euxo pipefail
          required=(
            body-finder-ruview-universal.apk
            body-finder-ruview.aab
            body-finder-ruview-legacy-minsdk21.apk
            body-finder-node-linux-x86_64.tar.gz
            body-finder-node-linux-x86_64.deb
            body-finder-node-windows-x86_64.zip
            body-finder-ruview-ios-simulator.zip
            ANDROID_BLE_ACQUISITION_CONTINUITY_RETEST.md
            IMPLEMENTATION_PLAN_BLE_ACQUISITION_CONTINUITY.md
            ble-range-calibration-profiles.json
            ble-range-calibration-schema.json
            ble-acquisition-regression-fixtures.zip
            ble-continuity-regression-fixtures.zip
            body-finder-validation-tools.zip
            capability-matrix.json
            release-manifest.json
            protocol-version.txt
            SBOM.spdx.json
          )
          for f in "${required[@]}"; do test -s "dist/$f"; done
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('dist/release-manifest.json').read_text())
          assert m['version']=='0.2.0-experimental.8'
          assert m['protocol_version']==2
          assert m['manual_node_coordinates_required'] is False
          assert m['ble_metric_profile']=='android-ble-lab-v1'
          assert m['ble_metric_profile_validated'] is True
          assert m['ble_metric_profile_physical_confidence']=='COARSE'
          assert m['ble_metric_rssi_at_1m_dbm']==-69.19
          assert m['ble_metric_path_loss_exponent']==3.62
          assert m['ble_metric_valid_distance_min_m']==0.5
          assert m['ble_metric_valid_distance_max_m']==5.0
          assert m['ble_metric_min_samples']==3
          assert m['ble_valid_rssi_prequeue_filter'] is True
          assert m['ble_last_valid_range_holdover'] is True
          assert m['ble_holdover_max_ms']==10000
          assert m['ble_scan_strategy']=='LOW_LATENCY_SOFTWARE_FILTERED_ALL_MATCHES'
          assert m['ble_primary_hardware_filter_count']==0
          assert m['ble_scan_match_mode_api23_plus']=='AGGRESSIVE'
          assert m['ble_scan_num_matches_api23_plus']=='MAX_ADVERTISEMENT'
          assert m['ble_scan_report_delay_ms']==0
          assert m['ble_interarrival_diagnostics'] is True
          assert m['android_api36_ranging_real_distance_only_resets_failure'] is True
          assert m['android_api36_ranging_ble_acquisition_yield'] is True
          assert m['android_api36_ranging_ble_yield_ms']==120000
          assert m['ble_metric_distance_silent_clamp_removed'] is True
          assert m['human_scanning_enabled'] is False
          assert m['human_localization_validated'] is False
          assert m['rescue_use_validated'] is False
          required={p.name for p in Path('dist').iterdir() if p.is_file()}
          listed=set(m['artifacts'])
          missing=(required-{'SHA256SUMS'})-listed
          if missing: raise SystemExit(f'manifest lacks files: {sorted(missing)}')
          PY

      - name: Generate checksums and verify
        shell: bash
        run: |
          set -euxo pipefail
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
          grep -q 'body-finder-ruview-universal.apk' dist/SHA256SUMS
          grep -q 'ANDROID_BLE_ACQUISITION_CONTINUITY_RETEST.md' dist/SHA256SUMS
          grep -q 'ble-acquisition-regression-fixtures.zip' dist/SHA256SUMS
          grep -q 'SBOM.spdx.json' dist/SHA256SUMS

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="dev-${GITHUB_RUN_NUMBER}"
          cat > /tmp/release-notes.md <<'EOF'
          Experimental Android BLE acquisition-continuity release.

          `android-ble-lab-v1` remains frozen at RSSI@1m=-69.19 dBm, n=3.62, validated COARSE, 0.5–5.0 m, with 3-sample fresh ranging and the existing bounded 10-second holdover. This release does not recalibrate or relax metric/solver rules.

          experimental.8 changes Android acquisition: primary BLE scanning is LOW_LATENCY + ALL_MATCHES with Body Finder manufacturer/payload validation in software, API23+ requests AGGRESSIVE/MAX_ADVERTISEMENT matching, and per-direction callback rate/inter-arrival/gap telemetry is exported. On API36+, RangingManager session-open is no longer treated as success; repeated closes without a real distance enter a bounded 120-second BLE-acquisition yield while independent BLE scanning remains active.

          **Start with `ANDROID_BLE_ACQUISITION_CONTINUITY_RETEST.md`.** Run Pixel 10 Pro, Pixel 7 Pro and Lenovo for five minutes with screens on and Body Finder foreground, then return the three full exports and screenshots.

          Hard gates: usable metric range uptime >=90% and Geometry 2D uptime >=90% on all three devices. Human scanning remains intentionally blocked. This software is not validated for rescue use.
          EOF
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Body Finder – RuView ${TAG} — BLE acquisition continuity" --notes-file /tmp/release-notes.md
          gh release upload "$TAG" dist/* --clobber
