name: dev20.13 engineering

on:
  push:
    branches: [main]
    paths: [DEV20_13_ENGINEERING_TRIGGER.txt]
  workflow_dispatch:
    inputs:
      target_ref:
        description: Ref to validate
        required: false
        default: implementation/dev20.13

permissions:
  contents: write

env:
  DETECTOR_ALGORITHM: deterministic-multinode-rssi-fusion-v9
  DETECTOR_HASH: f5795d40fbfb1de728b8576e214b249ada67f70d7962e1bf7794eb9c7d251f17

jobs:
  implement-and-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/dev20.13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Apply implementation
        run: python3 scripts/implement_dev20_13.py
      - name: Contract and distributed simulations
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/implement_dev20_13.py validation/analysis/test_dev20_13_contract.py validation/analysis/test_dev20_13_multi_runtime.py validation/analysis/test_dev20_13_artifact_transport.py validation/analysis/validate_dev20_13_pre_run_diagnostic.py validation/analysis/validate_dev20_13_g10.py
          python3 validation/analysis/test_dev20_13_contract.py
          python3 validation/analysis/test_dev20_13_multi_runtime.py
          python3 validation/analysis/test_dev20_13_artifact_transport.py
          python3 validation/analysis/test_post_dev19_v1.py
          grep -q "$DETECTOR_ALGORITHM" crates/body-finder-science/src/human_detector.rs
          grep -q "$DETECTOR_HASH" apps/mobile/src/detectorParameters.ts
          grep -q "BodyFinderControlPlaneV11" apps/mobile/src/humanPresence.ts
          grep -q "WireTransportTelemetryV13" apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          grep -q "AuthorityViewV1" apps/mobile/src/authority.ts
          grep -q "PRE_RUN_DIAGNOSTIC_V1" apps/mobile/App.tsx
          grep -q "GeometryPublicationV11" apps/mobile/src/autogeometry.ts
          grep -q "RangeFrameV9" apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          git diff --check
      - name: Rust regression
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
      - name: TypeScript gate
        working-directory: apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Android native compile and unit gate
        working-directory: apps/mobile
        run: |
          CI=1 npx expo prebuild --platform android --clean
          chmod +x android/gradlew
          ./android/gradlew -p android testReleaseUnitTest --stacktrace
      - name: Commit verified implementation to branch
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(dev20.13): deterministic distributed authority diagnostics"
            git push origin HEAD:implementation/dev20.13
          fi
