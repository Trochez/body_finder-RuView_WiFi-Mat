name: Dev Release experimental.16

on:
  push:
    branches: [main]
    paths: [RELEASE_DEV16_TRIGGER.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-exp16
  cancel-in-progress: false

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dev16 deterministic gates
        run: |
          set -euxo pipefail
          grep -q '0.2.0-experimental.16' apps/mobile/src/version.ts
          grep -q 'reportVersion: 18' apps/mobile/src/version.ts
          grep -q 'snapshotSchemaVersion: 4' apps/mobile/src/version.ts
          grep -q '"versionCode": 16' apps/mobile/app.json
          grep -q 'pub const PROTOCOL_VERSION: u16 = 2;' crates/body-finder-core/src/lib.rs
          grep -q 'RECOVERY_UNFILTERED_ACTION_TARGET_MS = 9_500L' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BleAcquisitionPolicy.kt
          grep -q 'FILTERED_PROBE_ACTION_TARGET_MS = 14_000L' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BleAcquisitionPolicy.kt
          grep -q 'dev16-self-contained-json-evidence-v4' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          ! grep -R -n 'dev13-self-contained-json-evidence\|dev15-self-contained-json-evidence' apps/mobile/App.tsx apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          python3 -m json.tool protocol/schemas/validation-run-snapshot-v4.json >/dev/null
          python3 -m json.tool validation/contracts/dev16-evidence-contract.json >/dev/null
          python3 -m json.tool validation/contracts/dev16-gates.json >/dev/null
          python3 -m py_compile validation/analysis/dev16_validation.py validation/analysis/validate_dev16_acceptance.py validation/analysis/validate_dev16_directed_smoke.py validation/analysis/build_dev16_acceptance_report.py validation/analysis/test_dev16_tooling.py scripts/generate_dev16_fixtures.py
          python3 validation/analysis/test_dev16_tooling.py
          python3 scripts/generate_dev16_fixtures.py
          mkdir -p /tmp/dev16-evidence && cp validation/fixtures/dev16/campaign/*.json /tmp/dev16-evidence/
          python3 validation/analysis/validate_dev16_directed_smoke.py --evidence-dir /tmp/dev16-evidence --output /tmp/directed.json
          python3 -c "import json; x=json.load(open('/tmp/directed.json')); assert x['pass'] and x['targeted_recovery_success_count']>=1"
          # Explicit regression expectations.
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'validation/analysis')
          from dev16_validation import validate_export,recovery_analysis
          from pathlib import Path
          b=Path('validation/fixtures/dev16/boundaries')
          for n in ['unfiltered-9999.json','unfiltered-10000.json','probe-14500.json','probe-14501.json','probe-14999.json','probe-15000.json','four-total-max-rolling-three.json']:
            x=json.load(open(b/n)); r=validate_export(x,True); assert r['pass'], (n,r)
          for n in ['unfiltered-10001.json','unfiltered-10148.json','probe-15001.json','four-in-rolling-five-min.json','long-ended-failed-safe.json','long-ended-active-probe.json','missing-acquisition-field.json']:
            x=json.load(open(b/n)); r=validate_export(x,True); assert not r['pass'], (n,r)
          x=json.load(open(b/'probe-14501.json')); r=validate_export(x,True); assert any('FILTERED_PROBE_EXIT_TARGET_MISSED' in w for w in r['warnings'])
          print('DEV16_FIXTURE_MATRIX_PASS')
          PY
          test -s DEV16_FROZEN_TRUTH.md
          test -s docs/TESTING_DEV16.md
          test -s validation/analysis/dev15_validation.py

  linux:
    needs: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace && cargo build --release -p body-finder-node
      - run: |
          set -euxo pipefail
          mkdir -p dist/pkg dist/deb/DEBIAN dist/deb/usr/bin
          cp target/release/body-finder-node dist/pkg/
          tar -C dist/pkg -czf dist/body-finder-node-linux-x86_64.tar.gz body-finder-node
          cp target/release/body-finder-node dist/deb/usr/bin/
          printf 'Package: body-finder-node\nVersion: 0.2.0~experimental16\nSection: science\nPriority: optional\nArchitecture: amd64\nMaintainer: Trochez\nDescription: Body Finder RuView field node\n' > dist/deb/DEBIAN/control
          dpkg-deb --build dist/deb dist/body-finder-node-linux-x86_64.deb
          test -s dist/body-finder-node-linux-x86_64.tar.gz
          test -s dist/body-finder-node-linux-x86_64.deb
      - uses: actions/upload-artifact@v4
        with: {name: dev16-linux, path: 'dist/*'}

  windows:
    needs: requirements
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p body-finder-node
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\win | Out-Null
          Copy-Item target\release\body-finder-node.exe dist\win\
          Compress-Archive dist\win\body-finder-node.exe dist\body-finder-node-windows-x86_64.zip
          if ((Get-Item dist\body-finder-node-windows-x86_64.zip).Length -le 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with: {name: dev16-windows, path: 'dist/*.zip'}

  android:
    needs: requirements
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: CI=1 npx expo prebuild --platform android --clean
      - run: chmod +x android/gradlew && ./android/gradlew -p android testReleaseUnitTest assembleRelease bundleRelease --stacktrace
      - run: |
          set -euxo pipefail
          mkdir -p ../../dist
          cp android/app/build/outputs/apk/release/*.apk ../../dist/body-finder-ruview-universal.apk
          cp ../../dist/body-finder-ruview-universal.apk ../../dist/BodyFinder-dev16-universal.apk
          cp android/app/build/outputs/bundle/release/*.aab ../../dist/body-finder-ruview.aab
          test -s ../../dist/body-finder-ruview-universal.apk
          test -s ../../dist/BodyFinder-dev16-universal.apk
          test -s ../../dist/body-finder-ruview.aab
      - uses: actions/upload-artifact@v4
        with: {name: dev16-android, path: 'dist/*'}

  android-legacy:
    needs: requirements
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/android-legacy}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/*.apk ../../dist/body-finder-ruview-legacy-minsdk21.apk
          test -s ../../dist/body-finder-ruview-legacy-minsdk21.apk
      - uses: actions/upload-artifact@v4
        with: {name: dev16-android-legacy, path: 'dist/*'}

  ios-simulator:
    needs: requirements
    runs-on: macos-latest
    defaults: {run: {working-directory: apps/mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: CI=1 npx expo prebuild --platform ios --clean
      - run: pod install
        working-directory: apps/mobile/ios
      - shell: bash
        working-directory: apps/mobile/ios
        run: |
          set -euxo pipefail
          W=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit); test -n "$W"
          xcodebuild -workspace "$W" -scheme BodyFinderRuView -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          A=$(find build/Build/Products -type d -name '*.app' -print -quit); test -n "$A"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --sequesterRsrc --keepParent "$A" "$GITHUB_WORKSPACE/dist/body-finder-ruview-ios-simulator.zip"
          test -s "$GITHUB_WORKSPACE/dist/body-finder-ruview-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with: {name: dev16-ios, path: 'dist/*'}

  release:
    needs: [requirements, linux, windows, android, android-legacy, ios-simulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'dev16-*', path: dist, merge-multiple: true}
      - name: Package canonical dev16 assets
        run: |
          set -euxo pipefail
          python3 scripts/generate_dev16_fixtures.py
          cp docs/TESTING_DEV16.md dist/TESTING_DEV16.md
          cp DEV16_FROZEN_TRUTH.md dist/DEV16_FROZEN_TRUTH.md
          cp validation/ground-truth/GROUND_TRUTH_TEMPLATE.json dist/GROUND_TRUTH_TEMPLATE.json
          cp protocol/schemas/validation-run-snapshot-v4.json dist/validation-run-snapshot-v4.schema.json
          cp validation/contracts/dev16-evidence-contract.json dist/dev16-evidence-contract.json
          cp validation/contracts/dev16-gates.json dist/dev16-gates.json
          cp docs/CAPABILITY_MATRIX_AUTOGEOMETRY.json dist/capability-matrix.json
          cp calibration/ble-range-calibration-profiles.json dist/
          cp calibration/ble-range-calibration-schema.json dist/
          cp upstream/ruvieW.lock.json dist/ruview-upstream-lock.json
          printf '2\n' > dist/protocol-version.txt
          printf '{"schema_version":1,"release_family":"0.2.0-experimental.16","models":[],"human_localization_validated":false}\n' > dist/model-manifest.json
          mkdir -p kit/validation/contracts kit/validation/fixtures/dev16
          cp validation/analysis/dev16_validation.py validation/analysis/validate_dev16_acceptance.py validation/analysis/validate_dev16_directed_smoke.py validation/analysis/build_dev16_acceptance_report.py validation/analysis/test_dev16_tooling.py kit/
          cp protocol/schemas/validation-run-snapshot-v4.json kit/
          cp docs/TESTING_DEV16.md kit/
          cp validation/contracts/dev16-*.json kit/validation/contracts/
          cp -r validation/fixtures/dev16/* kit/validation/fixtures/dev16/
          (cd kit && zip -qr ../dist/validators-dev16.zip .)
          (cd validation/fixtures/dev16 && zip -qr "$GITHUB_WORKSPACE/dist/fixtures-dev16.zip" .)
          SHA=$(git rev-parse HEAD); TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - <<PY
          import json
          json.dump({'schema_version':16,'release':'dev-16','version':'0.2.0-experimental.16','commit_sha':'$SHA','build_timestamp':'$TS','report_version':18,'protocol_version':2,'validation_snapshot_schema_version':4,'screenshots_required_for_acceptance':False,'json_evidence_self_contained':True,'ble_metric_profile':'android-ble-lab-v1','ble_recovery_unfiltered_hard_limit_ms':10000,'ble_recovery_unfiltered_action_target_ms':9500,'ble_filtered_probe_observed_target_ms':14500,'ble_filtered_probe_action_target_ms':14000,'ble_filtered_probe_hard_limit_ms':15000,'recovery_budget_limit':3,'recovery_budget_window_ms':300000,'physical_acceptance_status':'PENDING_USER_HARDWARE','final_go':False},open('dist/release-manifest.json','w'),indent=2)
          PY
      - name: Test packaged documented commands
        run: |
          set -euxo pipefail
          mkdir doc-test && cd doc-test
          unzip -q ../dist/validators-dev16.zip -d validators-dev16
          unzip -q ../dist/fixtures-dev16.zip -d fixtures-dev16
          python3 validators-dev16/test_dev16_tooling.py
          mkdir evidence-directed && cp fixtures-dev16/campaign/*.json evidence-directed/
          python3 validators-dev16/validate_dev16_directed_smoke.py --evidence-dir evidence-directed --output directed_smoke_report.json
          test -s directed_smoke_report.json
      - name: SBOM
        uses: anchore/sbom-action@v0
        with: {path: '.', format: spdx-json, output-file: dist/SBOM.spdx.json}
      - name: Canonical inventory and initial checksums
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('dist'); p=d/'release-manifest.json'; m=json.load(open(p))
          required='BodyFinder-dev16-universal.apk body-finder-ruview-universal.apk body-finder-ruview.aab body-finder-ruview-legacy-minsdk21.apk body-finder-node-linux-x86_64.tar.gz body-finder-node-linux-x86_64.deb body-finder-node-windows-x86_64.zip body-finder-ruview-ios-simulator.zip validators-dev16.zip fixtures-dev16.zip validation-run-snapshot-v4.schema.json dev16-evidence-contract.json dev16-gates.json GROUND_TRUTH_TEMPLATE.json TESTING_DEV16.md DEV16_FROZEN_TRUTH.md release-manifest.json capability-matrix.json ble-range-calibration-profiles.json ble-range-calibration-schema.json protocol-version.txt model-manifest.json ruview-upstream-lock.json SBOM.spdx.json'.split()
          missing=[x for x in required if not (d/x).is_file() or (d/x).stat().st_size==0]
          if missing: raise SystemExit('missing/non-empty gate: '+','.join(missing))
          static=[f for f in sorted(d.iterdir()) if f.is_file() and f.name not in {'release-manifest.json','SHA256SUMS.txt','release-verification.json'}]
          m['artifacts']=[{'name':f.name,'size_bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in static]
          p.write_text(json.dumps(m,indent=2)+'\n')
          PY
          printf '{"release":"dev-16","ci_pass":true,"redownload_verified":false,"checksums_verified":false,"physical_acceptance_status":"PENDING_USER_HARDWARE","final_go":false,"screenshots_required":false}\n' > dist/release-verification.json
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt)
      - name: Publish, redownload and verify dev-16 prerelease
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euxo pipefail
          git tag -f dev-16 "$GITHUB_SHA"; git push origin refs/tags/dev-16 --force
          gh release delete dev-16 -y || true
          gh release create dev-16 dist/* --prerelease --title 'dev-16 — 0.2.0-experimental.16' --notes 'Dev16 hardens the frozen completed-run contract: snapshot v4, monotonic recovery action deadlines, rolling 5-minute recovery budget, strict hard-limit validation, warning semantics, campaign-level targeted smoke and reproducible SHA-verified assets. Calibration/ranging/fusion/geometry remain frozen. No screenshots. Physical acceptance remains pending user hardware.'
          rm -rf verify && mkdir verify; gh release download dev-16 -D verify
          (cd verify && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('verify/release-verification.json'); x=json.load(open(p)); x['redownload_verified']=True; x['checksums_verified']=True; x['final_go']=False; p.write_text(json.dumps(x,indent=2)+'\n')
          PY
          (cd verify && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt)
          gh release upload dev-16 verify/release-verification.json verify/SHA256SUMS.txt --clobber
          rm -rf final-verify && mkdir final-verify; gh release download dev-16 -D final-verify
          (cd final-verify && sha256sum -c SHA256SUMS.txt)
          python3 -c "import json; x=json.load(open('final-verify/release-verification.json')); assert x['ci_pass'] and x['checksums_verified'] and x['redownload_verified'] and x['physical_acceptance_status']=='PENDING_USER_HARDWARE' and x['final_go'] is False"
