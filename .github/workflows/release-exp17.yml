name: Dev Release experimental.17

on:
  push:
    branches: [main]
    paths: [RELEASE_DEV17_TRIGGER.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-exp17
  cancel-in-progress: false

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Frozen diff and validator gates
        run: |
          set -euxo pipefail
          git fetch --tags --force
          grep -q '0.2.0-experimental.17' apps/mobile/src/version.ts
          grep -q 'versionCode: 17' apps/mobile/src/version.ts
          grep -q 'snapshotSchemaVersion: 4' apps/mobile/src/version.ts
          grep -q '"versionCode": 17' apps/mobile/app.json
          grep -q '"releaseIteration": "experimental.17"' apps/mobile/app.json
          grep -q 'pub const PROTOCOL_VERSION: u16 = 2;' crates/body-finder-core/src/lib.rs
          test -z "$(git diff --name-only dev-16...HEAD -- apps/mobile/modules crates calibration)"
          bad=$(git diff --name-only dev-16...HEAD -- apps/mobile/src | grep -v '^apps/mobile/src/version.ts$' || true); test -z "$bad"
          python3 -m json.tool protocol/schemas/validation-run-snapshot-v4.json >/dev/null
          python3 -m json.tool dev16_directed_baseline_report.json >/dev/null
          python3 -m py_compile validation/analysis/dev17_validation.py validation/analysis/validate_dev17_directed_baseline.py validation/analysis/validate_dev17_acceptance.py validation/analysis/build_dev17_final_report.py validation/analysis/test_dev17_tooling.py scripts/generate_dev17_fixtures.py
          rm -rf validation/fixtures/dev17
          python3 scripts/generate_dev17_fixtures.py validation/fixtures/dev17
          python3 validation/analysis/test_dev17_tooling.py
          python3 validation/analysis/test_dev16_tooling.py
          python3 - <<'PY'
          import json
          x=json.load(open('dev16_directed_baseline_report.json')); assert x['pass'] is True; assert x['unique_targeted_recovery_success_count']==2; assert x['validation_semantics']=='dev17-strict-events-frozen-crosscheck'
          PY
          test -s DEV17_FROZEN_TRUTH.md
          test -s DEV17_EVENT_COUNTER_MAPPING.md
          test -s docs/TESTING_DEV17.md
          test -s FINAL_GO_NO_GO_DEV17.md

  linux:
    needs: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace && cargo build --release -p body-finder-node
      - run: |
          set -euxo pipefail
          mkdir -p dist/pkg dist/deb/DEBIAN dist/deb/usr/bin
          cp target/release/body-finder-node dist/pkg/
          tar -C dist/pkg -czf dist/body-finder-node-linux-x86_64.tar.gz body-finder-node
          cp target/release/body-finder-node dist/deb/usr/bin/
          printf 'Package: body-finder-node\nVersion: 0.2.0~experimental17\nSection: science\nPriority: optional\nArchitecture: amd64\nMaintainer: Trochez\nDescription: Body Finder RuView field node\n' > dist/deb/DEBIAN/control
          dpkg-deb --build dist/deb dist/body-finder-node-linux-x86_64.deb
      - uses: actions/upload-artifact@v4
        with: {name: dev17-linux, path: 'dist/*'}

  windows:
    needs: requirements
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p body-finder-node
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\win | Out-Null
          Copy-Item target\release\body-finder-node.exe dist\win\
          Compress-Archive dist\win\body-finder-node.exe dist\body-finder-node-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with: {name: dev17-windows, path: 'dist/*.zip'}

  android:
    needs: requirements
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: CI=1 npx expo prebuild --platform android --clean
      - run: chmod +x android/gradlew && ./android/gradlew -p android testReleaseUnitTest assembleRelease bundleRelease --stacktrace
      - run: |
          set -euxo pipefail
          mkdir -p ../../dist
          cp android/app/build/outputs/apk/release/*.apk ../../dist/body-finder-ruview-universal.apk
          cp ../../dist/body-finder-ruview-universal.apk ../../dist/BodyFinder-dev17-universal.apk
          cp android/app/build/outputs/bundle/release/*.aab ../../dist/body-finder-ruview.aab
      - uses: actions/upload-artifact@v4
        with: {name: dev17-android, path: 'dist/*'}

  android-legacy:
    needs: requirements
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/android-legacy}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/*.apk ../../dist/body-finder-ruview-legacy-minsdk21.apk
      - uses: actions/upload-artifact@v4
        with: {name: dev17-android-legacy, path: 'dist/*'}

  ios-simulator:
    needs: requirements
    runs-on: macos-latest
    defaults: {run: {working-directory: apps/mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: CI=1 npx expo prebuild --platform ios --clean
      - run: pod install
        working-directory: apps/mobile/ios
      - shell: bash
        working-directory: apps/mobile/ios
        run: |
          set -euxo pipefail
          W=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit); test -n "$W"
          xcodebuild -workspace "$W" -scheme BodyFinderRuView -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          A=$(find build/Build/Products -type d -name '*.app' -print -quit); test -n "$A"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --sequesterRsrc --keepParent "$A" "$GITHUB_WORKSPACE/dist/body-finder-ruview-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with: {name: dev17-ios, path: 'dist/*'}

  release:
    needs: [requirements, linux, windows, android, android-legacy, ios-simulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'dev17-*', path: dist, merge-multiple: true}
      - name: Package canonical dev17 assets
        run: |
          set -euxo pipefail
          rm -rf validation/fixtures/dev17
          python3 scripts/generate_dev17_fixtures.py validation/fixtures/dev17
          cp docs/TESTING_DEV17.md dist/TESTING_DEV17.md
          cp DEV17_FROZEN_TRUTH.md dist/DEV17_FROZEN_TRUTH.md
          cp DEV17_EVENT_COUNTER_MAPPING.md dist/DEV17_EVENT_COUNTER_MAPPING.md
          cp FINAL_GO_NO_GO_DEV17.md dist/FINAL_GO_NO_GO_DEV17.md
          cp dev16_directed_baseline_report.json dist/dev16_directed_baseline_report.json
          cp protocol/schemas/validation-run-snapshot-v4.json dist/validation-run-snapshot-v4.schema.json
          mkdir -p kit
          cp validation/analysis/dev17_validation.py validation/analysis/validate_dev17_directed_baseline.py validation/analysis/validate_dev17_acceptance.py validation/analysis/build_dev17_final_report.py validation/analysis/test_dev17_tooling.py scripts/generate_dev17_fixtures.py kit/
          cp protocol/schemas/validation-run-snapshot-v4.json DEV17_EVENT_COUNTER_MAPPING.md DEV17_FROZEN_TRUTH.md docs/TESTING_DEV17.md dev16_directed_baseline_report.json kit/
          (cd kit && zip -qr ../dist/validators-dev17.zip .)
          (cd validation/fixtures/dev17 && zip -qr "$GITHUB_WORKSPACE/dist/fixtures-dev17.zip" .)
          SHA=$(git rev-parse HEAD); TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - <<PY
          import json
          json.dump({'schema_version':17,'release':'dev-17','version':'0.2.0-experimental.17','commit_sha':'$SHA','build_timestamp':'$TS','protocol_version':2,'validation_snapshot_schema_version':4,'screenshots_required_for_acceptance':False,'json_evidence_self_contained':True,'forbidden_runtime_diff_count':0,'baseline_dev16_pass':True,'physical_acceptance_status':'PENDING_3NODE','final_go':False},open('dist/release-manifest.json','w'),indent=2)
          json.dump({'release':'dev-17','ci_pass':True,'baseline_dev16_pass':True,'forbidden_runtime_diff_count':0,'redownload_verified':False,'checksums_verified':False,'physical_acceptance_status':'PENDING_3NODE','final_go':False,'warnings':[]},open('dist/release-verification.json','w'),indent=2)
          PY
      - name: Test packaged tools and inventory
        run: |
          set -euxo pipefail
          mkdir doc-test && cd doc-test
          unzip -q ../dist/validators-dev17.zip -d validators-dev17
          unzip -q ../dist/fixtures-dev17.zip -d fixtures-dev17
          python3 validators-dev17/test_dev17_tooling.py
          cd ..
          python3 - <<'PY'
          import pathlib
          d=pathlib.Path('dist')
          required='BodyFinder-dev17-universal.apk body-finder-ruview-universal.apk body-finder-ruview.aab body-finder-ruview-legacy-minsdk21.apk body-finder-node-linux-x86_64.tar.gz body-finder-node-linux-x86_64.deb body-finder-node-windows-x86_64.zip body-finder-ruview-ios-simulator.zip validators-dev17.zip fixtures-dev17.zip DEV17_FROZEN_TRUTH.md DEV17_EVENT_COUNTER_MAPPING.md TESTING_DEV17.md dev16_directed_baseline_report.json release-manifest.json release-verification.json'.split()
          missing=[x for x in required if not (d/x).is_file() or (d/x).stat().st_size==0]
          if missing: raise SystemExit('missing/non-empty gate: '+','.join(missing))
          PY
      - name: SBOM
        uses: anchore/sbom-action@v0
        with: {path: '.', format: spdx-json, output-file: dist/SBOM.spdx.json}
      - name: Manifest artifacts and checksums
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('dist'); p=d/'release-manifest.json'; m=json.load(open(p))
          files=[f for f in sorted(d.iterdir()) if f.is_file() and f.name!='SHA256SUMS.txt']
          m['artifacts']=[{'name':f.name,'size_bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in files if f.name!='release-manifest.json']
          p.write_text(json.dumps(m,indent=2)+'\n')
          files=[f for f in sorted(d.iterdir()) if f.is_file() and f.name!='SHA256SUMS.txt']
          (d/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.name}\n' for f in files))
          PY
      - name: Publish, redownload and verify dev-17 prerelease
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euxo pipefail
          git tag -f dev-17 "$GITHUB_SHA"; git push origin refs/tags/dev-17 --force
          gh release delete dev-17 -y || true
          gh release create dev-17 $(find dist -maxdepth 1 -type f -print | sort) --prerelease --title 'dev-17 — 0.2.0-experimental.17' --notes 'Dev17 hardens validator/tooling only: strict events↔global/per-peer counters↔frozen summaries, recovery reexport deduplication, anti-false-pass fixtures, dev16 directed baseline report, reproducible cross-platform assets and SHA redownload verification. BLE/runtime/calibration/fusion/autogeometry/protocol remain frozen. No screenshots. Final GO is intentionally PENDING_3NODE until one simultaneous >=330 s Pixel 10 + Pixel 7 + Lenovo run passes.'
          rm -rf verify && mkdir verify; gh release download dev-17 -D verify
          (cd verify && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import json,pathlib,hashlib
          d=pathlib.Path('verify'); p=d/'release-verification.json'; x=json.load(open(p)); x['redownload_verified']=True; x['checksums_verified']=True; x['final_go']=False; p.write_text(json.dumps(x,indent=2)+'\n')
          files=[f for f in sorted(d.iterdir()) if f.is_file() and f.name!='SHA256SUMS.txt']
          (d/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.name}\n' for f in files))
          PY
          gh release upload dev-17 verify/release-verification.json verify/SHA256SUMS.txt --clobber
          rm -rf final-verify && mkdir final-verify; gh release download dev-17 -D final-verify
          (cd final-verify && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import json
          x=json.load(open('final-verify/release-verification.json'))
          assert x['ci_pass'] and x['baseline_dev16_pass'] and x['forbidden_runtime_diff_count']==0
          assert x['checksums_verified'] and x['redownload_verified']
          assert x['physical_acceptance_status']=='PENDING_3NODE' and x['final_go'] is False
          PY
