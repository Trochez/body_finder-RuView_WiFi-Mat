name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce automatic-geometry product contract
        shell: bash
        run: |
          set -euo pipefail
          BAD=$(grep -R -n -E -- '(--x([ =]|$)|--y([ =]|$)|SET MEASURED POSITION|Set position|Guardar posición|x meters|y meters)' \
            apps/mobile/App.tsx apps/node/src/main.rs apps/android-legacy/app/src/main/java || true)
          if [ -n "$BAD" ]; then
            echo "Forbidden normal-flow manual geometry controls/arguments found:"
            echo "$BAD"
            exit 1
          fi
          grep -q 'pub const PROTOCOL_VERSION: u16 = 2;' crates/body-finder-core/src/lib.rs
          grep -q 'pub struct RangingCapability' crates/body-finder-core/src/lib.rs
          grep -q 'RANGE_SAMPLE_STALE_NS' crates/body-finder-core/src/lib.rs
          grep -q 'published_geometry' crates/body-finder-core/src/lib.rs
          grep -q 'ELECTED_COORDINATOR_PUBLICATION' apps/mobile/src/autogeometry.ts
          grep -q 'manual_geometry_override.*false' apps/mobile/App.tsx
          grep -q 'protocol_version.*2' protocol/schemas/autogeometry-v2.json
      - name: Enforce Android ranging acquisition/lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/android/check_android_ranging_contract.py
          grep -q 'android.permission.BLUETOOTH"' apps/mobile/app.json
          grep -q 'android.permission.BLUETOOTH_ADMIN' apps/mobile/app.json
          grep -q 'SCAN_MODE_LOW_LATENCY' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          grep -q 'body_finder_scan_results' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          grep -q 'last_close_reason' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/SystemRangingApi36.kt
      - name: Enforce validated BLE metric accuracy contract
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/android/check_ble_range_accuracy_contract.py
          grep -q 'android-ble-lab-v1' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BleRangeEstimator.kt
          grep -q 'metric_valid' apps/mobile/src/geometryDiagnostics.ts
          grep -q 'RECIPROCAL_INVERSE_VARIANCE' apps/mobile/src/rangeFusion.ts
          grep -q 'FOREGROUND_SERVICE_CONNECTED_DEVICE' apps/mobile/app.json
          grep -q 'CIRCUIT_BREAKER_FAILURES' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/SystemRangingApi36.kt
      - name: Enforce experimental.7 BLE metric continuity contract
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/android/check_ble_continuity_contract.py
          grep -q '0.2.0-experimental.7' apps/mobile/App.tsx
          grep -q 'HUMAN_SCANNING_ENABLED = false' apps/mobile/App.tsx
          grep -q 'BleRangeTemporalState.HOLDOVER' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BleContinuityPolicy.kt
          grep -q 'valid_rssi_sample_count_5s' apps/mobile/modules/body-finder-native/android/src/main/java/com/trochez/bodyfindernative/BodyFinderNativeModule.kt
          grep -q 'geometry_temporal_quality' apps/mobile/src/geometryDiagnostics.ts
          test -s IMPLEMENTATION_PLAN_BLE_METRIC_CONTINUITY_STABILIZATION.md
          test -s docs/ANDROID_BLE_METRIC_CONTINUITY_RETEST.md
          test -s validation/fixtures/ble-continuity/dev6-continuity-baseline.json
      - name: Validate JSON and Python tooling
        run: |
          set -euo pipefail
          python3 -m json.tool docs/CAPABILITY_MATRIX_AUTOGEOMETRY.json >/dev/null
          python3 -m json.tool validation/ground-truth/GROUND_TRUTH_TEMPLATE.json >/dev/null
          python3 -m json.tool validation/fixtures/autogeometry-triangle-v2.json >/dev/null
          python3 -m json.tool validation/fixtures/ble-range/t2-t4b-screening.json >/dev/null
          python3 -m json.tool validation/fixtures/ble-range/p0c-calibration-summary.json >/dev/null
          python3 -m json.tool validation/fixtures/ble-continuity/dev6-continuity-baseline.json >/dev/null
          python3 -m json.tool protocol/schemas/autogeometry-v2.json >/dev/null
          python3 -m json.tool calibration/ble-range-calibration-schema.json >/dev/null
          python3 -m json.tool calibration/ble-range-calibration-profiles.json >/dev/null
          for f in validation/fixtures/android-ranging/*.json; do python3 -m json.tool "$f" >/dev/null; done
          python3 -m py_compile validation/analysis/validate_autogeometry.py
          python3 -m py_compile validation/analysis/fit_ble_range_profile.py
          python3 -m py_compile validation/android/check_android_ranging_contract.py
          python3 -m py_compile validation/android/check_ble_range_accuracy_contract.py
          python3 -m py_compile validation/android/check_ble_continuity_contract.py
      - name: Validate schemas
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.23.0
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path('protocol/schemas/autogeometry-v2.json').read_text())
          fixture = json.loads(Path('validation/fixtures/autogeometry-triangle-v2.json').read_text())
          validator = Draft202012Validator(schema)
          errors=[]
          for i,node in enumerate(fixture['nodes']):
              errors += [f'nodes[{i}] {e.json_path}: {e.message}' for e in validator.iter_errors(node)]
          if errors: raise SystemExit('\n'.join(errors))
          cal_schema=json.loads(Path('calibration/ble-range-calibration-schema.json').read_text())
          profiles=json.loads(Path('calibration/ble-range-calibration-profiles.json').read_text())['profiles']
          cv=Draft202012Validator(cal_schema)
          cal_errors=[]
          for i,p in enumerate(profiles):
              cal_errors += [f'profiles[{i}] {e.json_path}: {e.message}' for e in cv.iter_errors(p)]
          if cal_errors: raise SystemExit('\n'.join(cal_errors))
          print(f'Validated {len(fixture["nodes"])} protocol advertisements and {len(profiles)} BLE calibration profiles')
          PY

  rust-linux:
    needs: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::possible_missing_else -A clippy::derivable_impls -A clippy::manual_is_multiple_of -A clippy::type_complexity
      - run: cargo test --workspace
      - run: cargo build --release -p body-finder-node

  rust-windows:
    needs: requirements
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p body-finder-node

  android:
    needs: requirements
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx tsc --noEmit
      - run: CI=1 npx expo prebuild --platform android --clean
      - name: Verify generated Android permissions and native field-service declaration
        shell: bash
        run: |
          set -euo pipefail
          APP_MANIFEST=android/app/src/main/AndroidManifest.xml
          MODULE_MANIFEST=modules/body-finder-native/android/src/main/AndroidManifest.xml
          for P in BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_SCAN BLUETOOTH_CONNECT BLUETOOTH_ADVERTISE WAKE_LOCK FOREGROUND_SERVICE FOREGROUND_SERVICE_CONNECTED_DEVICE CHANGE_WIFI_MULTICAST_STATE; do
            grep -q "android.permission.${P}" "$APP_MANIFEST"
          done
          grep -q 'BodyFinderFieldService' "$MODULE_MANIFEST"
          grep -q 'android:foregroundServiceType="connectedDevice"' "$MODULE_MANIFEST"
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleRelease bundleRelease --stacktrace
        working-directory: apps/mobile/android
      - name: Verify foreground service in merged release manifest
        shell: bash
        run: |
          set -euo pipefail
          MERGED=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml -type f -exec grep -l 'BodyFinderFieldService' {} \; | head -n 1)
          test -n "$MERGED"
          grep -q 'BodyFinderFieldService' "$MERGED"
          grep -q 'foregroundServiceType="connectedDevice"' "$MERGED"
      - uses: actions/upload-artifact@v4
        with:
          name: android-ci
          if-no-files-found: error
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab

  android-legacy:
    needs: requirements
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Create test signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-legacy-ci
          if-no-files-found: error
          path: apps/android-legacy/app/build/outputs/apk/release/*.apk

  ios-simulator:
    needs: requirements
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npx tsc --noEmit
      - run: CI=1 npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build unsigned iOS Simulator app
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | ruby -rjson -e 'j=JSON.parse(STDIN.read); schemes=j.fetch("workspace").fetch("schemes"); preferred="BodyFinderRuView"; abort("Expected app scheme #{preferred} not found") unless schemes.include?(preferred); puts preferred')
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP=$(find build/Build/Products -type d -name '*.app' -print -quit)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/body-finder-ruview-ios-simulator-ci.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-ci
          if-no-files-found: error
          path: body-finder-ruview-ios-simulator-ci.zip
